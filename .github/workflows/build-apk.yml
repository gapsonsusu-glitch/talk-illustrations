name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare app files
        run: |
          mkdir -p www
          cp index.html www/
          echo "" | base64 -d > icon-192.png
          echo "" | base64 -d > app.keystore
      - name: Create Android app
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          npx cap init "Talk Illustrations" com.gideonsreku.talkillustrations --web-dir www
          npx cap add android
          npx cap sync android
      - name: Icon, version and vibration
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icon-192.png android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp icon-192.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.VIBRATE" /></manifest>#' android/app/src/main/AndroidManifest.xml
      - name: Use the app's own signing key
        run: |
          mkdir -p ~/.android
          cp app.keystore ~/.android/debug.keystore
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../talk-illustrations.apk
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Talk Illustrations (build ${{ github.run_number }})
          make_latest: true
          files: talk-illustrations.apk
