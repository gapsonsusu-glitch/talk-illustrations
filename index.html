<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f4fd1"><link rel="manifest" href="manifest.json"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Illustrations"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Talk Illustrations</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
/* Layout: phone-first notecard app — sticky blue header, stacked cards, five-tab bottom bar, bottom sheets for actions */
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#14213d; --muted:#5b6782; --line:#dde3ef;
  --accent:#1f4fd1; --on-accent:#ffffff; --accent-soft:#e6edff; --mark:#f2b705; --mark-soft:#fff4cf;
  --ok:#1d8a5b; --warn:#b26a00; --bad:#c0392b; --wa:#1a8f4c;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --read:"Literata",Georgia,serif;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1324; --card:#151d33; --ink:#e8edf8; --muted:#9aa6c2; --line:#26304a;
  --accent:#7aa2ff; --on-accent:#0d1324; --accent-soft:#1c2a52; --mark:#f5c84a; --mark-soft:#3a3218;
  --ok:#4cc38a; --warn:#f0a43a; --bad:#ff7b6b; --wa:#4cc38a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1324; --card:#151d33; --ink:#e8edf8; --muted:#9aa6c2; --line:#26304a;
  --accent:#7aa2ff; --on-accent:#0d1324; --accent-soft:#1c2a52; --mark:#f5c84a; --mark-soft:#3a3218;
  --ok:#4cc38a; --warn:#f0a43a; --bad:#ff7b6b; --wa:#4cc38a; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--ui);font-size:15px;line-height:1.5;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#1f4fd1}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#1f4fd1;color:#fff}
header .wrap{padding-block:14px 12px;display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:10px;background:#fff;display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px}
header h1{font-family:var(--display);font-size:20px;margin:0;line-height:1.1;letter-spacing:-.01em}
header p{margin:0;font-size:12.5px;opacity:.85}
main .wrap{padding-block:16px;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--display);font-size:22px;margin:4px 0 0;text-wrap:balance}
h4{font-family:var(--display);font-size:15px;margin:0}
.sub{color:var(--muted);margin:0;font-size:14px}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrapit{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:999px;font:500 13.5px var(--ui);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:12px}
.ill{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ill .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ill h3{font-family:var(--display);font-size:18px;margin:0;line-height:1.25;text-wrap:balance}
.tag{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
.tag.mine{color:var(--ok)}
.story{font-family:var(--read);font-size:16px;line-height:1.6;margin:0}
.point{background:var(--mark-soft);border-radius:10px;padding:10px 12px;font-size:14.5px}
.point b{font-family:var(--display);font-weight:700}
.twi{border-left:3px solid var(--accent);padding:4px 0 4px 12px;font-family:var(--read);white-space:pre-wrap;font-size:15.5px}
.scr{font-size:14px;color:var(--muted)}
.scr a{color:var(--accent)}
.used{font-size:13px;color:var(--warn);font-weight:600}
.unused{font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font:500 13.5px var(--ui);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.wa{color:var(--wa);border-color:var(--wa)}
.btn.big{padding:13px 16px;font-size:15px;width:100%;justify-content:center}
.btn.danger{color:var(--bad)}
.star{border:none;background:none;font-size:20px;cursor:pointer;color:var(--muted);line-height:1;padding:2px}
.star[aria-pressed="true"]{color:var(--mark)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
label{font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:6px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;font-weight:400}
textarea{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.two{grid-template-columns:1fr}}
.note{font-size:13.5px;color:var(--ink);background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.note.warn{background:var(--mark-soft)}
.empty{text-align:center;color:var(--muted);padding:28px 12px;border:1px dashed var(--line);border-radius:14px}
.talk{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.talk>button.head{all:unset;box-sizing:border-box;width:100%;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.talk>button.head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.talk h3{font-family:var(--display);margin:0;font-size:17px;line-height:1.25}
.talk .meta{font-size:13px;color:var(--muted)}
.talk .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.talk ol{margin:0;padding-left:20px;font-size:14.5px;display:flex;flex-direction:column;gap:6px}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--ok)}
.pill.soon{background:var(--mark-soft);color:var(--warn)}
.block{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14.5px;font-family:var(--read)}
.block b{font-family:var(--ui);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{border:none;background:none;color:var(--muted);font:600 11.5px var(--ui);padding:10px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.sheet{position:fixed;inset:0;background:rgba(10,15,30,.55);z-index:15;display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow:auto}
.sheet h3{font-family:var(--display);margin:0;font-size:19px}
.sheet .list-btn{text-align:left;justify-content:flex-start;width:100%;padding:12px}
.steps{margin:0;padding-left:20px;font-size:14.5px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .8s linear infinite;vertical-align:-3px}
@keyframes s{to{transform:rotate(360deg)}}
pre.prompt{white-space:pre-wrap;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin:0;max-height:140px;overflow:auto}
.clock{font-family:var(--display);font-weight:700;font-size:clamp(64px,22vw,120px);line-height:1;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--ink);padding-block:8px}
.clock.soon{color:var(--warn)}
.clock.over{color:var(--bad)}
.clock-sub{text-align:center;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
details summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent)}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.toast{transition:none}}
/* Scripture Trail */
.code{font:800 18px var(--display);letter-spacing:.06em;text-align:center;background:var(--mark-soft);color:var(--warn);border-radius:12px;padding:10px;word-break:break-all}
.rankrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rank{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:5px 12px;font:800 14px var(--display)}
.seg4{grid-template-columns:repeat(5,1fr)!important}.seg4 button{font-size:12.5px!important}
.routes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.route{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.route.on{border-color:var(--accent);background:var(--accent-soft)}.route .ri{font-size:26px}.route b{font:800 15px var(--display)}.route small{color:var(--muted);font-size:12.5px}
.jprog{height:12px;background:var(--line);border-radius:99px;overflow:hidden}.jprog i{display:block;height:100%;background:linear-gradient(90deg,#f2b705,#1d8a5b);border-radius:99px}
.jwrap{max-width:420px;margin:0 auto;width:100%}.jmap{width:100%;height:auto;display:block;border-radius:18px;box-shadow:0 1px 0 var(--line)}
.chap{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:8px}.chap>span{flex:1;font-weight:600}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin:10px 0}
.chgrid button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 0;font:700 13px var(--ui);cursor:pointer;font-variant-numeric:tabular-nums}
.chgrid button[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.season{border:none;border-radius:14px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;color:#fff;width:100%}
.season.mem{background:linear-gradient(135deg,#6b2d5c,#a8456f)}.season.conv{background:linear-gradient(135deg,#1d6b42,#2f8f5b)}
.season b{font:800 16px var(--display)}.season small{opacity:.9}

body.questonly nav.tabs{display:none}body.questonly{padding-bottom:20px}
.qbar{display:flex;align-items:center;gap:8px}
.purse{display:flex;align-items:center;gap:6px;background:var(--mark-soft);color:var(--warn);border-radius:999px;padding:5px 14px 5px 6px;font:800 17px var(--display);font-variant-numeric:tabular-nums}
.purse.bump{animation:bump .4s}@keyframes bump{40%{transform:scale(1.18)}}
.coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe27a,#f2b705 60%,#c98f00);box-shadow:inset 0 0 0 2px #e0a800;display:inline-block;flex:none}
.hbtn{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer}
.hbtn[aria-pressed="false"]{opacity:.45}.hbtn svg{width:20px;height:20px}
.seg4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--card);border:1px solid var(--line);padding:5px;border-radius:14px}
.seg4 button{border:none;background:none;color:var(--muted);font:700 13.5px var(--ui);padding:9px 2px;border-radius:10px;cursor:pointer}
.seg4 button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.qdaily{background:linear-gradient(135deg,#1f4fd1,#3b6cf0);color:#fff;border:none}
.streak{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border-radius:999px;padding:4px 10px;font:700 13px var(--ui);color:#fff}
.qstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qstats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;font-size:12.5px;color:var(--muted)}
.qstats b{display:block;font:800 21px var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lvl{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.lvl b{font:800 15px var(--display)}.lvl small{font-size:11.5px;color:var(--muted);text-align:center}
.lvl[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.score{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.team{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;padding:6px 10px}
.team.now{border-color:var(--accent)}.team input{border:none;background:none;padding:4px 0;font:700 14px var(--ui);min-width:0}
.team b{font:800 20px var(--display);font-variant-numeric:tabular-nums}
.qgroup{display:flex;flex-direction:column;gap:10px}
.qgroup h3{margin:0;font:800 17px var(--display)}
.badge{background:var(--mark-soft);color:var(--warn);border-radius:12px;padding:8px 12px;font:700 14px var(--ui);text-align:center}
.album{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media(max-width:520px){.album{grid-template-columns:repeat(3,minmax(0,1fr))}}
.gcard{perspective:900px;aspect-ratio:3/4;border:none;background:none;padding:0;cursor:pointer;max-width:100%;width:100%}
.gcard .in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.gcard.open .in{transform:rotateY(180deg)}
.gcard:not(.open) .front,.gcard.open .back{opacity:0;transition:opacity 0s .3s}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;text-align:left}
.back{background:repeating-linear-gradient(45deg,#1f4fd1 0 9px,#2a5ae0 9px 18px);color:#fff;justify-content:center;align-items:center;text-align:center;gap:6px;border:3px solid #fff;box-shadow:0 1px 0 var(--line)}
.back .lock{width:26px;height:26px}.back small{font:600 10.5px/1.25 var(--ui);background:rgba(0,0,0,.25);border-radius:6px;padding:3px 5px}
.front{transform:rotateY(180deg);color:#fff;border:3px solid #f2b705}
.front .big{position:absolute;top:4px;right:8px;font:800 44px var(--display);opacity:.25;line-height:1}
.front b{font:800 14px/1.15 var(--display)}.front span{font-size:10.5px;opacity:.9}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dots{display:flex;gap:5px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
.dots i.ok{background:var(--ok)}.dots i.no{background:var(--bad)}.dots i.now{background:var(--accent)}
.turn{align-self:flex-start;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font:800 14px var(--display)}
.timer{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.timer i{display:block;height:100%;width:100%;background:var(--ok);transition:width .1s linear}.timer i.low{background:var(--bad)}
.qq{font:700 19px/1.35 var(--display);margin:0}
.hint{font-size:13.5px;color:var(--muted)}.hint a{color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:600 15px var(--ui);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}.opt.ok{border-color:var(--ok);background:var(--accent-soft)}.opt.no{border-color:var(--bad);background:var(--mark-soft)}.opt.gone{visibility:hidden}
.lifes{display:flex;gap:6px;flex-wrap:wrap}
.life{border:1px dashed var(--warn);background:var(--mark-soft);color:var(--warn);border-radius:10px;padding:6px 10px;font:700 12.5px var(--ui);cursor:pointer;display:flex;align-items:center;gap:5px}
.life.plain{border-style:solid;background:var(--card);color:var(--ink);border-color:var(--line)}.life .coin{width:15px;height:15px}.life:disabled{opacity:.45;cursor:default}
.fb{border-radius:12px;padding:10px 12px;font-size:14.5px}.fb.ok{background:var(--accent-soft)}.fb.no{background:var(--mark-soft)}.fb a{color:var(--accent)}
.reveal{display:flex;flex-direction:column;gap:10px;align-items:center}
.board{position:relative;width:100%;max-width:420px;aspect-ratio:1;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:3px;background:var(--line);border-radius:14px;overflow:hidden;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.tile{position:relative;background:var(--card);display:grid;place-items:center;overflow:hidden}
.tile canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.tile .qm{font:800 32px var(--display);color:var(--line)}
.tile.pop canvas{animation:pop .6s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{transform:scale(.3) rotate(-12deg);opacity:0}}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.gtile{border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px;font:700 12px var(--ui);padding:6px;text-align:center;cursor:pointer;min-width:0}
.gtile.active{border-color:var(--accent)}.gtile small{color:var(--muted);font-weight:600}
.thumb{width:100%;aspect-ratio:1;border-radius:8px;height:auto}
.price{display:flex;align-items:center;gap:4px;color:var(--warn)}.price .coin{width:14px;height:14px}
.tl{display:flex;flex-direction:column;gap:8px}
.ev{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:600 15px var(--ui);text-align:left;cursor:pointer;display:flex;gap:10px;align-items:center}
.ev .n{width:26px;height:26px;border-radius:50%;background:var(--line);display:grid;place-items:center;font:800 13px var(--display);flex:none;color:var(--muted)}
.ev.set{border-color:var(--accent)}.ev.set .n{background:var(--accent);color:var(--on-accent)}

{t:"Faith",h:"The trotro driver you never questioned",s:"You board a trotro to Kasoa at dawn. You can't see the road ahead from the back seat, and you don't know the driver's name, yet you sit back and even sleep. Why? Because he has made that trip many times and you have seen him arrive.",p:"Real faith isn't blind. It rests on a track record, and Jehovah's record of keeping his word is perfect.",r:"Hebrews 11:1; Joshua 23:14"},
{t:"Faith",h:"Saying the chair is strong",s:"Anyone can stand beside a plastic chair and say, \"It will hold me.\" But you only show you believe it when you actually sit down on it.",p:"Faith is shown by what we do, not only by what we say.",r:"James 2:17, 18"},
{t:"Faith",h:"Planting before the rains",s:"A farmer in the north plants his seed in dry, hard ground before a single drop has fallen. He isn't foolish. He has watched the seasons for years and knows the rains will come.",p:"We act now on Jehovah's promises because we know his 'seasons' never fail.",r:"Hebrews 11:6; Habakkuk 2:3"},
{t:"Prayer",h:"A network that is never busy",s:"Sometimes you call and hear, \"The number you are calling is not reachable,\" or the network drops at the worst moment. But you can speak to Jehovah at midnight, on the road, in the market, and the line is never busy.",p:"Jehovah is always reachable. We can pray anytime, about anything.",r:"Psalm 65:2; 1 Thessalonians 5:17"},

{t:"Prayer",h:"Holding Daddy's hand at the lorry station",s:"A small child crossing the busy road at a lorry station doesn't study the traffic. He just holds his father's hand tightly and walks when his father walks.",p:"In prayer we hold Jehovah's hand through situations too big for us.",r:"Isaiah 41:10, 13"},
{t:"Endurance",h:"Watering the concrete",s:"After a mason casts a slab, he keeps pouring water on it for days. A visitor might think the concrete is being troubled. In fact, that slow curing is what makes it strong enough to carry a whole storey.",p:"Trials we endure faithfully make our faith stronger and more useful.",r:"James 1:2-4; 1 Peter 1:6, 7"},
{t:"Endurance",h:"The palm tree in the harmattan",s:"When strong winds blow, the palm tree bends far over, almost touching the ground. But its roots go deep, and after the storm it stands straight again.",p:"Deep roots in God's Word let us bend under pressure without breaking.",r:"Psalm 92:12-14; Colossians 2:6, 7"},
{t:"Endurance",h:"The runner who sees the finish line",s:"In a long race, the runners who finish are not always the fastest at the start. They are the ones who keep a steady pace and keep their eyes on the finish line.",p:"Endurance is about steady faithfulness to the end, not a fast start.",r:"Hebrews 12:1, 2; Matthew 24:13"},

{t:"Love",h:"Lights off, generator on",s:"When there is 'dumsor' and the whole street goes dark, you quickly see which house has a generator. Anyone can shine when there is power.",p:"Love is proved when things are hard, by actions and not just words.",r:"1 John 3:18; Proverbs 17:17"},

{t:"Forgiveness",h:"Tearing out the debt page",s:"A shopkeeper keeps a notebook of who owes her. One day, moved by a customer's hardship, she tears out his page completely. She doesn't just put it aside to remind him later.",p:"When Jehovah forgives, he cancels the debt. We should forgive the same way.",r:"Colossians 3:13; Psalm 103:12"},

{t:"Humility",h:"The branch full of fruit",s:"Look at a mango tree in season. The branches heavy with fruit bend low to the ground. The empty branches point straight up.",p:"The more we truly have to offer, the lower we should bow.",r:"Proverbs 22:4; 1 Peter 5:5"},
{t:"Humility",h:"The empty barrel",s:"Knock on a full barrel and you hear a dull sound. Knock on an empty one and it booms loudly.",p:"Loud self-praise often shows emptiness. Let our works speak.",r:"Proverbs 27:2; Proverbs 11:2"},

{t:"Hope",h:"Seeing the house plan",s:"Before a family moves into a new house, they study the building plan and talk about which room will be whose. They are excited because the builder is reliable.",p:"Bible promises are a reliable 'plan' of the new world we can already picture.",r:"Revelation 21:3, 4; 2 Peter 3:13"},
{t:"Hope",h:"Ticket in hand at the station",s:"At the bus station, the person holding a ticket waits calmly even if the bus is late. The one without a ticket keeps worrying.",p:"Jehovah's promises are our 'ticket'. We can wait with calm hope.",r:"Habakkuk 2:3; Romans 5:5"},
{t:"Choices",h:"When the GPS says recalculating",s:"You take a wrong turn and the GPS doesn't shout at you. It calmly says \"recalculating\" and shows the way back to the road.",p:"Jehovah's Word guides us, and helps us return when we go off course.",r:"Psalm 119:105; Isaiah 30:21"},
{t:"Choices",h:"The shortcut through the bush",s:"A path through the bush looks shorter than the main road. But it may lead to a swamp or snakes, and you end up far later than those on the road.",p:"A way that seems right can end badly. Trust Jehovah's road.",r:"Proverbs 14:12; Proverbs 3:5, 6"},
{t:"Choices",h:"One bad tomato in the basket",s:"Leave one rotten tomato in a basket overnight. By morning, the good ones around it have started to spoil. The good ones never make the bad one fresh.",p:"Bad company spoils good habits. Choose friends carefully.",r:"1 Corinthians 15:33; Proverbs 13:20"},
{t:"Bible study",h:"Eating once a week",s:"Imagine someone who eats one big meal on Sunday and nothing else all week. By Wednesday he is weak and dizzy, however big Sunday's meal was.",p:"We need regular personal Bible reading, not only meetings.",r:"Matthew 4:4; Psalm 1:2, 3"},
{t:"Bible study",h:"Reading the manufacturer's manual",s:"When a new generator gives trouble, the wise man reads the manual written by the people who made it, not the advice of a passer-by.",p:"Our Maker's book tells us how life works best.",r:"2 Timothy 3:16, 17; Isaiah 48:17"},
{t:"Obedience",h:"The hard hat on site",s:"A new labourer may find the hard hat hot and annoying. Then one day a piece of block falls from the scaffold, and he understands the rule.",p:"Jehovah's laws protect us even when we can't yet see the danger.",r:"Isaiah 48:17, 18; Psalm 19:7-11"},
{t:"Obedience",h:"Following the doctor's prescription",s:"A patient feels better after two days and stops the medicine. A week later the sickness returns, stronger than before.",p:"Obeying fully, not just when it feels needed, keeps us spiritually healthy.",r:"Proverbs 3:7, 8; James 1:22"},
{t:"Jehovah's care",h:"The hen and her chicks",s:"When a hawk circles over the farm, the mother hen gives one sharp call and every chick runs under her wings. She spreads herself over them, ready to take the attack.",p:"Jehovah protects those who run to him.",r:"Psalm 91:4; Matthew 23:37"},

/* ---------- Asking Claude ---------- */
let sampleP=null;
function getSample(){if(!sampleP)sampleP=(window.claude&&window.claude.use)?window.claude.use("sample").catch(()=>null):Promise.resolve(null);return sampleP}
function parseJSON(text){
  let t=String(text||"").replace(/```(?:json)?/gi,"").trim();
  const a=t.search(/[\[{]/);if(a<0)throw new Error("no json");
  const open=t[a],close=open==="["?"]":"}";const b=t.lastIndexOf(close);
  return JSON.parse(t.slice(a,b+1));
}
function openSheet(html){
  const sh=document.createElement("div");sh.className="sheet";
  sh.innerHTML=`<div class="box" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(sh);
  sh.addEventListener("click",e=>{if(e.target===sh||e.target.closest("[data-close]"))sh.remove()});
  return sh;
}
function busy(label){const sh=openSheet(`<p style="margin:8px 0;font-size:16px"><span class="spin"></span>&nbsp; ${esc(label)}</p>`);return()=>sh.remove()}
function manualAsk(prompt,json){
  return new Promise((res,rej)=>{
    const link=prompt.length<6000?"https://claude.ai/new?q="+encodeURIComponent(prompt):"https://claude.ai/new";
    const sh=openSheet(`<h3>Ask Claude</h3>
      <p class="sub">In the installed app this takes 3 quick steps:</p>
      <ol class="steps"><li>Copy the request.</li><li>Open Claude, paste it (if it isn't already there) and send.</li><li>Copy Claude's whole answer and paste it below.</li></ol>
      <div class="row"><button class="btn primary" data-k="copy">1. Copy request</button><a class="btn" href="${link}" target="_blank" rel="noopener">2. Open Claude</a></div>
      <pre class="prompt" id="ask-pr">${esc(prompt)}</pre>
      <label>3. Paste Claude's answer here<textarea id="ask-in" placeholder="Paste the answer"></textarea></label>
      <div id="ask-err"></div>
      <div class="row"><button class="btn primary" data-k="use">Use answer</button><button class="btn" data-k="cancel">Cancel</button></div>`);
    sh.addEventListener("click",e=>{
      if(e.target===sh){rej({code:"cancel"});return}
      const k=e.target.closest("[data-k]")?.dataset.k;if(!k)return;
      if(k==="copy")copy(prompt,"ask-pr");
      if(k==="cancel"){sh.remove();rej({code:"cancel"})}
      if(k==="use"){
        const v=sh.querySelector("#ask-in").value.trim();
        if(!v){sh.querySelector("#ask-err").innerHTML=`<div class="note warn">Paste Claude's answer first.</div>`;return}
        if(!json){sh.remove();res(v);return}
        try{const out=parseJSON(v);sh.remove();res(out)}
        catch(err){sh.querySelector("#ask-err").innerHTML=`<div class="note warn">That answer couldn't be read. Make sure you copied all of Claude's reply, from the first [ or { to the end.</div>`}
      }
    });
  });
}
async function aiRun(prompt,json,label){
  const s=await getSample();
  if(s){
    const close=busy(label||"Asking Claude…");
    try{const out=json?await s.json(prompt,{modelTier:"default"}):(await s(prompt,{modelTier:"default"})).text;close();return out}
    catch(e){close();if(e&&e.code==="not_granted")return manualAsk(prompt,json);throw e}
  }
  return manualAsk(prompt,json);
}
function aiError(e){
  if(e&&e.code==="cancel")return;
  toast(e&&e.code==="rate_limited"?"Too many requests just now. Wait a minute and try again.":"Couldn't get an answer. Check your internet and try again.");
}

/* ---------- Illustration cards ---------- */
function usedHtml(id){
  const u=(S.used[id]||[]).slice().sort((a,b)=>a.d<b.d?1:-1);
  if(!u.length)return `<div class="unused">Not used yet</div>`;
  return `<div class="used">Used ${u.length}× · last at ${esc(u[0].w||"a meeting")}, ${fmtDate(u[0].d)}</div>`;
}
function card(b,opts={}){
  if(opts.fresh){
    return `<article class="ill">
      <div class="top"><div><div class="tag">${esc(b.t)} · new</div><h3>${esc(b.h)}</h3></div></div>
      <p class="story">${esc(b.s)}</p>
      <div class="point"><b>The point:</b> ${esc(b.p)}</div>
      ${b.r?`<div class="scr">📖 <a href="${wol(b.r)}" target="_blank" rel="noopener">${esc(b.r)}</a></div>`:""}
      <div class="row"><button class="btn primary" data-a="keep" data-i="${opts.i}" ${b.kept?"disabled":""}>${b.kept?"Kept ✓":"Keep in my bank"}</button>
      <a class="btn wa" href="${wa(plain(b))}" target="_blank" rel="noopener">WhatsApp</a>
      <button class="btn" data-a="copyfresh" data-i="${opts.i}">Copy</button></div>
    </article>`;
  }
  const fav=S.fav.includes(b.id),x=S.extra[b.id]||{};
  return `<article class="ill">
    <div class="top"><div><div class="tag ${b.mine?"mine":""}">${esc(b.t)}${b.mine?" · mine":""}</div><h3>${esc(b.h)}</h3></div>
    <button class="star" data-a="fav" data-id="${b.id}" aria-pressed="${fav}" aria-label="Save to favourites">${fav?"★":"☆"}</button></div>
    <p class="story">${esc(b.s)}</p>
    <div class="point"><b>The point:</b> ${esc(b.p)}</div>
    ${b.r?`<div class="scr">📖 <a href="${wol(b.r)}" target="_blank" rel="noopener">${esc(b.r)}</a></div>`:""}
    ${x.twi&&twiOpen.has(b.id)?`<div class="twi">${esc(x.twi)}</div>`:""}
    ${usedHtml(b.id)}
    <div class="row">
      <button class="btn" data-a="totalk" data-id="${b.id}">Add to a talk</button>
      <a class="btn wa" href="${wa(plain(b))}" target="_blank" rel="noopener">WhatsApp</a>
      ${x.twi?`<button class="btn" data-a="twitoggle" data-id="${b.id}">${twiOpen.has(b.id)?"Hide Twi":"Show Twi"}</button>`:""}
      <button class="btn" data-a="more" data-id="${b.id}" aria-label="More actions">⋯ More</button>
    </div></article>`;
}

/* ---------- Bank ---------- */
function renderBank(){
  const chips=["All","★ Saved","Not used yet","Mine",...themes()];
  let items=all();
  if(theme==="★ Saved")items=items.filter(b=>S.fav.includes(b.id));
  else if(theme==="Mine")items=items.filter(b=>b.mine);
  else if(theme==="Not used yet")items=items.filter(b=>!(S.used[b.id]||[]).length);
  else if(theme!=="All")items=items.filter(b=>b.t===theme);
  if(q){const k=q.toLowerCase();items=items.filter(b=>(b.h+b.s+b.p+b.r+b.t+((S.extra[b.id]||{}).twi||"")).toLowerCase().includes(k))}
  const nudge=(S.talks.length||S.mine.length)&&Date.now()-(S.lastBackup||0)>14*864e5;
  view.innerHTML=`${nudge?`<div class="note warn row" style="justify-content:space-between">Back up your talks so you don't lose them.<button class="btn" data-a="gomore">Back up now</button></div>`:""}
  <h2>Illustration bank</h2>
  <input class="search" id="q" type="search" placeholder="Search: prayer, family, hope, Psalm 91…" value="${esc(q)}">
  <div class="chips">${chips.map(t=>`<button class="chip" data-a="theme" data-v="${esc(t)}" aria-pressed="${t===theme}">${esc(t)}</button>`).join("")}</div>
  <div class="count">${items.length} illustration${items.length===1?"":"s"}</div>
  <div class="list">${items.length?items.map(b=>card(b)).join(""):`<div class="empty">Nothing here yet. Try another theme, or get fresh ideas.</div>`}</div>`;
  const qi=document.getElementById("q");
  qi.oninput=e=>{q=e.target.value;const pos=qi.selectionStart;renderBank();const n=document.getElementById("q");n.focus();n.setSelectionRange(pos,pos)};
}

/* ---------- More-actions sheet for one illustration ---------- */
function moreSheet(id){
  const b=byId(id);
  const sh=openSheet(`<h3>${esc(b.h)}</h3>
    <button class="btn list-btn" data-k="twi">🗣️ Twi version</button>

let T={mins:5,acc:0,start:0,running:false,talkId:"",b1:false,b0:false},wakeLock=null;
const elapsed=()=>T.acc+(T.running?Date.now()-T.start:0);
function fmtMs(ms){const s=Math.floor(Math.abs(ms)/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
async function lockOn(){try{wakeLock=await navigator.wakeLock?.request("screen")}catch(e){}}
function lockOff(){try{wakeLock&&wakeLock.release();wakeLock=null}catch(e){}}
function renderTimer(){
  view.innerHTML=`<button class="btn" data-a="backtalks" style="align-self:flex-start">← My talks</button><h2>Practise your talk</h2>
  <div class="panel">
    <label>Talk (optional)<select id="tm-talk"><option value="">— Just a timer —</option>${S.talks.filter(t=>!t.given).map(t=>`<option value="${t.id}" ${t.id===T.talkId?"selected":""}>${esc(t.title)}</option>`).join("")}</select></label>
    <div class="chips wrapit">${[3,4,5,10,15,30,45].map(m=>`<button class="chip" data-a="mins" data-v="${m}" aria-pressed="${m===T.mins}">${m} min</button>`).join("")}</div>
    <div id="clock" class="clock">0:00</div>
    <div id="clock-sub" class="clock-sub"></div>
    <div class="two"><button class="btn primary big" data-a="tstart" id="tstart">Start</button><button class="btn big" data-a="treset">Reset</button></div>
    ${T.talkId?`<button class="btn" data-a="tsave">Save this practice time to the talk</button>`:""}
    <p class="sub">The clock turns orange in the last minute and red when you go over. The phone vibrates at 1 minute left and at time up.</p>
  </div>`;
  document.getElementById("tm-talk").onchange=e=>{T.talkId=e.target.value;const t=talkById(T.talkId);if(t){T.mins=t.mins||DEFAULT_MINS[t.type]||5}renderTimer()};
  tick();
}
function tick(){
  const el=elapsed(),rem=T.mins*60000-el;
  if(T.running){if(rem<=60000&&!T.b1){T.b1=true;vib(250)}if(rem<=0&&!T.b0){T.b0=true;vib([500,200,500])}}
  if(tab!=="timer")return;
  const c=document.getElementById("clock");if(!c)return;
  c.textContent=(rem<0?"+":"")+fmtMs(rem);
  c.className="clock"+(rem<0?" over":rem<=60000&&el>0?" soon":"");
  document.getElementById("clock-sub").textContent=rem<0?`Over time · spoken ${fmtMs(el)}`:`left of ${T.mins} min · spoken ${fmtMs(el)}`;
  const b=document.getElementById("tstart");if(b)b.textContent=T.running?"Pause":el>0?"Continue":"Start";
}
setInterval(tick,250);

const backupText=()=>JSON.stringify({app:"talk-illustrations",version:VERSION,saved:new Date().toISOString(),data:S});
const backupName=()=>`talk-illustrations-backup-${today()}.json`;
async function nativeBackup(){
  try{const P=window.Capacitor.Plugins;const path=backupName();
    await P.Filesystem.writeFile({path,data:backupText(),directory:"CACHE",encoding:"utf8"});
    const {uri}=await P.Filesystem.getUri({path,directory:"CACHE"});
    await P.Share.share({title:"Talk Illustrations backup",files:[uri]});
    S.lastBackup=Date.now();save();renderMore();
  }catch(e){if(!/cancel/i.test(String(e&&e.message)))toast("Couldn't send the backup. Use “Copy backup text” instead.")}
}
async function saveBackupFile(){
  if(isNative())return nativeBackup();
  const text=backupText();
  try{const d=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
    if(d){const r=await d.save({filename:backupName(),data:text});if(r&&r.status){S.lastBackup=Date.now();save();renderMore();toast("Backup saved")}return}}catch(e){if(e&&e.code&&e.code!=="unavailable"){toast("Backup not saved");return}}
  try{const url=URL.createObjectURL(new Blob([text],{type:"application/json"}));const a=document.createElement("a");a.href=url;a.download=backupName();document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);S.lastBackup=Date.now();save();renderMore();toast("Backup saved to Downloads")}
  catch(e){toast("Couldn't save the file. Use “Copy backup text” instead.")}
}
async function shareBackup(){
  if(isNative())return nativeBackup();
  try{const file=new File([backupText()],backupName(),{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Talk Illustrations backup"});S.lastBackup=Date.now();save();renderMore();return}}catch(e){if(e&&e.name==="AbortError")return}
  toast("Sending files isn't possible here. Use “Save backup file”.");
}
function restore(text){
  try{
    const o=JSON.parse(text);const d=o.data||o;if(!Array.isArray(d.talks)||!Array.isArray(d.mine))throw 0;
    const mids=new Set(S.mine.map(m=>m.id));d.mine.forEach(m=>{if(!mids.has(m.id))S.mine.push(m)});
    S.fav=[...new Set([...S.fav,...(d.fav||[])])];
    d.talks.forEach((t,i)=>{t.id=t.id||("t"+Date.now()+i);const j=S.talks.findIndex(x=>x.id===t.id);if(j<0)S.talks.push(t);else S.talks[j]=t});
    Object.entries(d.used||{}).forEach(([id,arr])=>{const cur=S.used[id]||[];arr.forEach(u=>{if(!cur.some(c=>c.d===u.d&&c.w===u.w))cur.push(u)});S.used[id]=cur});
    (d.lib||[]).forEach(x=>{if(!S.lib.some(y=>y.id===x.id))S.lib.push(x)});
    if(d.quest&&Object.keys(d.quest.cards||{}).length>=Object.keys(S.quest.cards||{}).length)Object.assign(S.quest,d.quest);
    (d.kept||[]).forEach(k=>{S.kept=S.kept||[];if(!S.kept.some(x=>x.r===k.r&&x.open===k.open))S.kept.push(k)});
    (d.plans||[]).forEach(p=>{S.plans=S.plans||[];if(!S.plans.some(x=>x.id===p.id))S.plans.push(p)});
    Object.entries(d.extra||{}).forEach(([id,x])=>S.extra[id]={...x,...(S.extra[id]||{})});
    S.talks.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    save();renderMore();toast("Backup restored");
  }catch(e){toast("That isn't a Talk Illustrations backup")}
}
async function checkUpdate(){
  if(!navigator.onLine){toast("You're offline. Connect to the internet and try again.");return}
  const close=busy("Checking for updates…");
  try{const reg=await navigator.serviceWorker?.getRegistration();if(reg)await reg.update()}catch(e){}
  setTimeout(()=>{close();location.reload()},900);
}

async function copy(text,fallbackId){
  try{await navigator.clipboard.writeText(text);toast("Copied")}
  catch(e){const el=fallbackId&&document.getElementById(fallbackId);if(el){if(el.tagName==="TEXTAREA"){el.value=text;el.select()}else{const r=document.createRange();r.selectNodeContents(el);getSelection().removeAllRanges();getSelection().addRange(r)}}toast("Selected. Copy it from your keyboard menu")}
}

/* ---------- Ministry: reading files ---------- */
let pdfP=null;
function loadPdfJs(){
  if(!pdfP)pdfP=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";res(window.pdfjsLib)};s.onerror=()=>{pdfP=null;rej()};document.head.appendChild(s)});
  return pdfP;
}
async function loadMaterial(file){
  if(!file)return;
  const close=busy("Reading the file…");
  try{
    let text="";
    if(/pdf$/i.test(file.type)||/\.pdf$/i.test(file.name)){
      const lib=await loadPdfJs();const doc=await lib.getDocument({data:await file.arrayBuffer()}).promise;
      for(let p=1;p<=Math.min(doc.numPages,12);p++){const c=await (await doc.getPage(p)).getTextContent();text+=c.items.map(i=>i.str).join(" ")+"\n"}
    }else text=await file.text();
    FS.meetingText=text.replace(/[ \t]+/g," ").trim().slice(0,12000);close();renderMinistry();toast("File loaded. Check the text, then make the plan.");
  }catch(e){close();toast("Couldn't read this file. Copy the text from JW Library and paste it instead.")}
}

    case "deeper":{const x=fsList(v)[i];insightSheet(x.r,x.key,null);return true}

    case "saveplan":{const o=JSON.parse(JSON.stringify(v==="meeting"?FS.meeting:FS.family));(S.plans=S.plans||[]).unshift({id:"p"+Date.now(),kind:v,d:today(),obj:o});save();el.textContent="Saved ✓";el.disabled=true;return true}
    case "copyplan":copy(planText(v,v==="meeting"?FS.meeting:FS.family));return true;
    case "openplan":openTalk=openTalk===el.dataset.id?"":el.dataset.id;renderMinistry();return true;
    case "delplan":if(el.dataset.sure){S.plans=S.plans.filter(p=>p.id!==el.dataset.id);save();renderMinistry()}else{el.dataset.sure=1;el.textContent="Tap again to delete"}return true;
  }

}

const surePill=s=>{s=String(s||"").toLowerCase();return `<span class="pill ${s==="high"?"ok":"soon"}" ${s==="low"?'style="color:var(--bad)"':""}>${s==="high"?"Sure":s==="medium"?"Fairly sure":"Check first"}</span>`};
function insightHtml(o){
  const r=o.root||{};
  return `${r.word?`<div class="block"><b>Original ${esc(r.lang||"language")}</b><span style="font-size:17px">${esc(r.word)}</span>${r.translit?` <i>(${esc(r.translit)})</i>`:""}<br>Literally: “${esc(r.meaning||"")}”<br>${esc(r.insight||"")}</div>`:""}
  ${(o.langs||[]).map(l=>`<div class="block"><b>${esc(l.lang)}</b><div class="row" style="justify-content:space-between"><span>“${esc(l.says)}”</span>${surePill(l.sure)}</div>Literally: “${esc(l.literal||"")}”<br>${esc(l.insight||"")}</div>`).join("")}
  ${(o.background||[]).length?`<div class="block" style="font-family:var(--ui)"><b>Background: customs and history</b><ul class="steps" style="padding-left:18px">${o.background.map(b=>`<li>${esc(b)}</li>`).join("")}</ul></div>`:""}
  ${(o.quotes||[]).length?`<div class="block" style="font-family:var(--ui)"><b>Where to find what scholars said</b><ul class="steps" style="padding-left:18px">${o.quotes.map(q=>`<li><a href="${wolSearch(q.search||q.pub)}" target="_blank" rel="noopener">${esc(q.pub)}</a>${q.what?" — "+esc(q.what):""}</li>`).join("")}</ul></div>`:""}
  ${o.ghana?`<div class="block"><b>Ghana picture</b>${esc(o.ghana)}</div>`:""}
  ${o.use?`<div class="point"><b>Use it:</b> ${esc(o.use)}</div>`:""}`;
}
const insightText=(v,k,o)=>{const r=o.root||{};return `*Word insight: ${v}${k?" — “"+k+"”":""}*\n${r.word?`${r.lang}: ${r.word}${r.translit?" ("+r.translit+")":""} = “${r.meaning}”. ${r.insight}\n`:""}${(o.langs||[]).map(l=>`${l.lang}: “${l.says}” = “${l.literal}”. ${l.insight}`).join("\n")}${(o.background||[]).length?"\nBackground:\n"+o.background.map(b=>"• "+b).join("\n"):""}${(o.quotes||[]).length?"\nScholar quotes: "+o.quotes.map(q=>q.pub).join("; "):""}${o.ghana?"\nGhana picture: "+o.ghana:""}${o.use?"\nUse it: "+o.use:""}`};

    <p class="sub" style="font-size:13px">Check other languages in JW Library, where the New World Translation is available in many languages. Don't use anything marked “Check first” until you have checked it.</p>`);

    if(k==="go"){
      if(!v){toast("Type the verse first");return}
      const prompt=`You help a Jehovah's Witness speaker in Ghana bring out the depth of a Bible verse.
Verse: ${v} (New World Translation)
Key word: ${kw||"choose the single most meaningful word in the verse"}

1. Give the key word in the original Hebrew, Aramaic or Greek: the word, its transliteration, its literal meaning, and the insight it gives. Keep in line with the understanding of Jehovah's Witnesses (as in the New World Translation study notes) where it applies.

3. Give 2 or 3 short background points: customs, history or what the setting was like then, that help the verse come alive.
4. Name 2 or 3 publications of Jehovah's Witnesses where the speaker can likely find what scholars or historians said on this verse (for example the Insight on the Scriptures volumes, The Watchtower or Awake!), with search words. Do not invent quotations.
5. Give one quick everyday Ghana picture that makes the point land.
6. One sentence on how to use this in a talk or at the door.

Return ONLY JSON, no other text:
{"root":{"lang":"Hebrew or Greek","word":"","translit":"","meaning":"","insight":""},"langs":[{"lang":"","says":"","literal":"","insight":"","sure":"high|medium|low"}],"background":[""],"quotes":[{"pub":"","what":"what to look for","search":""}],"ghana":"","use":""}`;
      try{last=await aiRun(prompt,true,"Digging into the word…");sh.querySelector("#wi-out").innerHTML=insightHtml(last);sh.querySelector("#wi-acts").hidden=false}catch(err){aiError(err)}
    }
  });
}

const QLIFE={verse:10,half:15,skip:20,time:10};
function qQuiz({title,qs,level,pay,onDone,timers}){
  const L=QLEVEL[level]||QLEVEL.easy;pay=pay??L.pay;
  let i=0,score=0,results=[],timer=null;
  const sh=openSheet("");const box=sh.querySelector(".box");
  sh.addEventListener("click",e=>{if(e.target===sh)stop()});
  const fam=QG.fam.on;
  function stop(){clearInterval(timer);try{speechSynthesis.cancel()}catch(_){}sh.remove()}
  function show(){
    clearInterval(timer);
    const TT=timers?timers[i]||0:L.timer;
    const [q,...rest]=qs[i];const ref=rest[4],opts=rest.slice(0,4);
    const order=qShuffle(opts.map((o,k)=>({o,k})));
    const team=fam?QG.fam.teams[QG.fam.turn%QG.fam.teams.length]:null;
    box.innerHTML=`<div class="qtop"><b style="font:800 16px var(--display)">${esc(title)}</b><div class="dots">${qs.map((_,k)=>`<i class="${k<i?(results[k]?"ok":"no"):k===i?"now":""}"></i>`).join("")}</div></div>
      ${team?`<div class="turn">${esc(team.n)}'s turn</div>`:""}
      ${(timers?timers[i]:L.timer)?`<div class="timer"><i id="q-bar"></i></div>`:""}
      <p class="qq">${esc(q)}</p>
      ${L.hint?`<div class="hint">Hint: <a href="${wol(ref)}" target="_blank" rel="noopener">${esc(ref)}</a></div>`:""}
      <div class="opts">${order.map(x=>`<button class="opt" data-k="${x.k}">${esc(x.o)}</button>`).join("")}</div>
      <div class="lifes">
        ${L.hint?"":`<button class="life" data-l="verse"><span class="coin"></span>${QLIFE.verse} Show the verse</button>`}
        <button class="life" data-l="half"><span class="coin"></span>${QLIFE.half} Remove two</button>
        ${TT?`<button class="life" data-l="time"><span class="coin"></span>${QLIFE.time} +15 seconds</button>`:""}
        <button class="life" data-l="skip"><span class="coin"></span>${QLIFE.skip} Skip</button>
        <button class="life plain" data-l="read">Read aloud</button>
      </div>
      <div id="q-fb"></div>
      <div style="display:flex;gap:8px"><button class="btn" data-x="quit" style="flex:1;justify-content:center">Stop</button><button class="btn primary" data-x="next" style="flex:2;justify-content:center" hidden>${i<qs.length-1?"Next question":"See result"}</button></div>`;
    qSay(q+". "+order.map(x=>x.o).join(". "));
    let done=false,left=TT*10,total=left;
    if(TT){timer=setInterval(()=>{left--;const b=document.getElementById("q-bar");if(b){b.style.width=(left/total*100)+"%";b.classList.toggle("low",left<60)}if(left%10===0&&left<=50&&left>0)QSFX.tick();if(left<=0){clearInterval(timer);if(!done){done=true;results[i]=false;QSFX.wrong();mark(null);fb(false,"Time's up!")}}},100)}
    function fb(ok,pre){box.querySelector("#q-fb").innerHTML=`<div class="fb ${ok?"ok":"no"}">${pre||(ok?"Correct!":"Not quite.")} ${ok?"":`The answer is <b>${esc(opts[0])}</b>.`} Read it in <a href="${wol(ref)}" target="_blank" rel="noopener">${esc(ref)}</a>.</div>`}
    function mark(chosen){clearInterval(timer);box.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(+b.dataset.k===0)b.classList.add("ok");else if(b===chosen)b.classList.add("no")});box.querySelectorAll(".life").forEach(b=>{if(b.dataset.l!=="read")b.disabled=true});box.querySelector("[data-x=next]").hidden=false;if(fam)QG.fam.turn++;save()}
    box.onclick=e=>{
      const o=e.target.closest(".opt"),l=e.target.closest(".life"),x=e.target.closest("[data-x]");
      if(x&&x.dataset.x==="quit"){stop();return}
      if(x&&x.dataset.x==="next"){i++;if(i<qs.length)show();else finish();return}
      if(l&&!done){
        const t=l.dataset.l;
        if(t==="read"){qSay(q+". "+order.map(x=>x.o).join(". "),true);return}
        if(!qSpend(QLIFE[t]))return;l.disabled=true;
        if(t==="verse")box.querySelector("#q-fb").innerHTML=`<div class="fb ok">The answer is in <a href="${wol(ref)}" target="_blank" rel="noopener">${esc(ref)}</a>. Open it and read.</div>`;
        if(t==="half"){let n=0;box.querySelectorAll(".opt").forEach(b=>{if(+b.dataset.k!==0&&n<2){b.classList.add("gone");n++}})}
        if(t==="time"){left+=150;total+=150}
        if(t==="skip"){done=true;results[i]=true;score++;mark(null);box.querySelector("#q-fb").innerHTML=`<div class="fb ok">Skipped. The answer: <b>${esc(opts[0])}</b> (${esc(ref)})</div>`}
        return}
      if(o&&!done){done=true;const ok=+o.dataset.k===0;results[i]=ok;
        if(ok){score++;QSFX.right();if(pay)qAdd(pay,o);if(team){team.s+=pay||5}}else QSFX.wrong();mark(o);fb(ok)}
    };
  }
  function finish(){stop();onDone({score,total:qs.length,results})}
  show();
}

function qArtFor(p){
  if(p.id==="custom")return qArt.custom||null;

  <h3 style="margin:0;font:800 18px var(--display)">Gallery</h3>
  <div class="gallery">${list.map(x=>{const own=QG.owned[x.id]||x.price===0;return `<button class="gtile ${x.id===p.id?"active":""}" data-q="${own?"pick":"buy"}" data-v="${x.id}">

function qPaintBoard(){
  const p=qPuzList().find(x=>x.id===qPuzzle);const art=qArtFor(p);

function qPaintTile(k,art,anim){

function qNextPiece(){
  const p=qPuzList().find(x=>x.id===qPuzzle);const got=QG.pieces[p.id]||[];
  QG.noPay=QG.noPay||{};const free=QG.noPay[p.id];
  const k=got.length;const all=p.qs();const q=all[k%all.length];

function qOwnPicture(file){
  if(!file)return;const r=new FileReader();

/* actions */
function questAction(el){
  if(trailAction(el))return;
  const a=el.dataset.q,v=el.dataset.v;
  switch(a){
    case "view":qview=v;QSFX.tap();if(v==="timeline"&&qChecked)qTl=null;renderQuest();break;
    case "snd":QG.sound=!QG.sound;save();renderQuest();if(QG.sound)QSFX.coin();break;
    case "voice":QG.voice=!QG.voice;save();renderQuest();toast(QG.voice?"Questions will be read aloud":"Read aloud is off");break;
    case "level":QG.level=v;save();QSFX.tap();renderQuest();break;
    case "daily":qQuiz({title:"Daily challenge",qs:[qDailyQ()],level:QG.level,pay:10,onDone:r=>{
      const y=new Date(Date.now()-864e5).toISOString().slice(0,10);QG.streak=QG.lastDaily===y?QG.streak+1:1;QG.lastDaily=today();
      if(QG.streak>1)qAdd(QG.streak*2);save();renderQuest();if(r.score)QSFX.win();toast(QG.streak>1?`Streak ${QG.streak}! Bonus ${QG.streak*2} coins`:"Streak started!")}});break;
    case "famtoggle":QG.fam.on=!QG.fam.on;save();renderQuest();break;
    case "teamadd":QG.fam.teams.push({n:"Team "+"ABCD"[QG.fam.teams.length],s:0});save();renderQuest();break;
    case "teamdel":QG.fam.teams.pop();save();renderQuest();break;
    case "teamreset":QG.fam.teams.forEach(t=>t.s=0);QG.fam.turn=0;save();renderQuest();break;
    case "copygame":copy(SHORT_TRAIL);break;
    case "card":{const c=QCHARS.find(x=>x.id===v);QG.cards[c.id]?qShowCard(c):qPlayCard(c);break}
    case "bonus":{const gi=+v;qQuiz({title:QGROUPS[gi].n+" · Expert bonus",qs:qShuffle(QB[gi]),level:"expert",pay:20,onDone:r=>{
      if(r.score===r.total){QG.bonus[gi]=true;save();renderQuest();QSFX.win();qAdd(100);toast(`🏅 ${QGROUPS[gi].n} master! +100 coins`)}else{renderQuest();toast(`${r.score} of ${r.total}. Try again for the badge!`)}}});break}
    case "piece":qNextPiece();break;
    case "replay":QG.pieces[qPuzzle]=[];delete QG.done[qPuzzle];QG.noPay=QG.noPay||{};QG.noPay[qPuzzle]=true;save();renderQuest();break;
    case "pick":qPuzzle=v;renderQuest();break;
    case "buy":{const p=QPUZ.find(x=>x.id===v);if(!p)break;if(el.dataset.sure){if(qSpend(p.price)){QG.owned[v]=true;qPuzzle=v;save();QSFX.win();renderQuest();toast(p.n+" unlocked!")}}else{el.dataset.sure=1;el.querySelector("span").textContent=`Tap again to unlock`;}break}
    case "ev":{if(qChecked)break;const i=+v,p=qPicks.indexOf(i);if(p>=0)qPicks.splice(p,1);else qPicks.push(i);qTone([[440+qPicks.length*60,.08,0,"triangle"]]);renderQuest();break}
    case "tlnew":qTl=null;renderQuest();break;
    case "tlcheck":{qChecked=true;const right=qTl.slice().sort((a,b)=>a-b);const ok=qPicks.filter((e,i)=>right[i]===e).length;
      if(ok===qTl.length){QSFX.win();qAdd(QG.level==="expert"?40:25,el);toast("Perfect order!")}else{QSFX.wrong();if(ok)qAdd(ok*2,el);toast(`${ok} of ${qTl.length} in the right place`)}renderQuest();break}
  }
}
view.addEventListener("click",e=>{const el=e.target.closest("[data-q]");if(el&&tab==="quest"&&el.tagName!=="INPUT")questAction(el)});
view.addEventListener("input",e=>{if(e.target.dataset.q==="teamname"){QG.fam.teams[+e.target.dataset.i].n=e.target.value||"Team";save()}});

  let d=`M${pts[0][0]},${pts[0][1]}`;for(let i=1;i<N;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i];d+=` C${x0},${(y0+y1)/2} ${x1},${(y0+y1)/2} ${x1},${y1}`}
  const seg=frac*(N-1),si=Math.min(N-2,Math.floor(seg)),t=seg-si;
  const bez=(p0,p1,u)=>{const c0=[p0[0],(p0[1]+p1[1])/2],c1=[p1[0],(p0[1]+p1[1])/2];const m=1-u;return [m*m*m*p0[0]+3*m*m*u*c0[0]+3*m*u*u*c1[0]+u*u*u*p1[0],m*m*m*p0[1]+3*m*m*u*c0[1]+3*m*u*u*c1[1]+u*u*u*p1[1]]};
  const [mx,my]=frac>=1?pts[N-1]:bez(pts[si],pts[si+1],t);
  const reached=Math.floor(seg+1e-9);
  let deco="";
  if(rt.id==="accra"){for(let i=0;i<14;i++){const x=(i*53)%W,y=30+(i*71)%(H-60);deco+=`<rect x="${x}" y="${y}" width="22" height="${16+(i%3)*8}" rx="2" fill="${["#e8d5b5","#f2c6a0","#d9e4f2"][i%3]}" opacity=".9"/><rect x="${x+4}" y="${y+4}" width="5" height="5" fill="#7a8aa0"/>`}}
  if(rt.id==="tree"){deco+=`<rect x="${W/2-40}" y="40" width="80" height="${H-60}" rx="30" fill="#8b5a2b"/>`;for(let i=0;i<9;i++){const y=60+i*(H-120)/8,s=i%2?1:-1;deco+=`<path d="M${W/2},${y+20} q${s*90},-30 ${s*140},-10" stroke="#7a4a22" stroke-width="12" fill="none" stroke-linecap="round"/><circle cx="${W/2+s*140}" cy="${y+8}" r="34" fill="#4f9a4a" opacity=".85"/>`}deco+=`<circle cx="${W/2}" cy="50" r="70" fill="#5aa84f" opacity=".9"/>`}
  if(rt.id==="israel"||rt.id==="exodus"){for(let i=0;i<7;i++){const x=(i*97)%W,y=40+(i*83)%(H-80);deco+=`<path d="M${x-40},${y+30} q40,-50 80,0 z" fill="${rt.id==="israel"?"#c9b07a":"#d9b06a"}" opacity=".8"/>`}if(rt.id==="exodus")deco+=`<rect x="0" y="${H*0.62}" width="${W}" height="26" fill="#3d7bbf" opacity=".7"/>`;if(rt.id==="israel")deco+=`<ellipse cx="${W-60}" cy="${H*0.18}" rx="40" ry="24" fill="#5fa8d8" opacity=".85"/>`}
  if(rt.id==="paul"){for(let i=0;i<8;i++){const x=(i*113)%W,y=30+(i*97)%(H-60);deco+=`<ellipse cx="${x}" cy="${y}" rx="${26+(i%3)*10}" ry="14" fill="#e8d9a8"/><ellipse cx="${x}" cy="${y-4}" rx="${14+(i%3)*6}" ry="8" fill="#7fb069"/>`}}
  if(rt.id==="ark"){for(let i=0;i<Math.round(frac*24);i++){deco+=`<rect x="20" y="${H-30-i*((H-60)/24)}" width="${W-40}" height="${(H-60)/24-3}" rx="3" fill="#9a5a2c" opacity=".55"/>`}}
  return `<svg class="jmap" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(rt.n)} progress map">
    <defs><linearGradient id="jbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${rt.bg[0]}"/><stop offset="1" stop-color="${rt.bg[1]}"/></linearGradient></defs>
    <rect width="${W}" height="${H}" rx="18" fill="url(#jbg)"/>${deco}
    <path d="${d}" stroke="${rt.path}" stroke-width="${rt.id==="paul"?4:18}" fill="none" stroke-linecap="round" ${rt.id==="paul"?'stroke-dasharray="2 10"':""} opacity=".95"/>
    ${rt.id==="paul"?"":`<path d="${d}" stroke="${rt.dash}" stroke-width="3" fill="none" stroke-dasharray="10 10"/>`}
    <g><circle cx="${mx}" cy="${my}" r="22" fill="#1f4fd1" stroke="#fff" stroke-width="3"/><text x="${mx}" y="${my+7}" font-size="20" text-anchor="middle">${rt.icon}</text></g>
    ${pts.map(([x,y],i)=>{const on=i<=reached;const right=x<W/2;return `<g><circle cx="${x}" cy="${y}" r="13" fill="${on?"#f2b705":"#fff"}" stroke="#14213d" stroke-width="2.5"/>${on?`<path d="M${x-5},${y} l4,4 l7,-8" stroke="#14213d" stroke-width="2.5" fill="none"/>`:""}
      <rect x="${right?x+18:x-18-(rt.stops[i].length*7.2+14)}" y="${y-12}" width="${rt.stops[i].length*7.2+14}" height="24" rx="12" fill="rgba(255,255,255,.92)"/>

(function(){const m=location.hash.match(/^#ch-([0-9a-z]+(?:x[0-9a-z]+)*)-(\d)-([A-Za-z0-9]{0,16})(?:-([emx]))?$/);if(m){const ids=m[1].split("x").map(s=>parseInt(s,36)).filter(n=>n>=0&&n<ALLQ.length);if(ids.length===5)qIncoming={ids,score:+m[2],name:m[3]||"A friend",lv:m[4]||"m"}}})();
/* challenge code, e.g. 6EEX4-5674A-5X-GIDEON: 5 question numbers, score + level, name */
function chCode(ids,score,lv){const q=ids.map(i=>i.toString(36).toUpperCase().padStart(2,"0")).join("");const nm=(QG.meName||"Friend").replace(/[^A-Za-z0-9]/g,"").slice(0,12).toUpperCase()||"FRIEND";return `${q.slice(0,5)}-${q.slice(5)}-${score}${(lv||"m").toUpperCase()}-${nm}`}
function chParse(code){
  const p=String(code||"").toUpperCase().replace(/[^A-Z0-9-]/g,"").split("-").filter(Boolean);if(p.length<3)return null;
  const q=(p[0]+p[1]);const m=p[2].match(/^([0-5])([EMX])$/);if(q.length!==10||!m)return null;
  const ids=[];for(let i=0;i<10;i+=2){const n=parseInt(q.slice(i,i+2),36);if(isNaN(n)||n>=ALLQ.length)return null;ids.push(n)}
  const nm=(p.slice(3).join("")||"A friend");return {ids,score:+m[1],lv:m[2].toLowerCase(),name:nm.charAt(0)+nm.slice(1).toLowerCase()}}
const chLink=(ids,score,lv)=>`${appUrl()}#ch-${ids.map(i=>i.toString(36)).join("x")}-${score}-${(QG.meName||"Friend").replace(/[^A-Za-z0-9]/g,"").slice(0,16)||"Friend"}-${lv||"m"}`;
function qRng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
/* questions get harder as you go: easier ones first (first 3 of each card), harder ones last */
function chPick(lv,rnd){rnd=rnd||Math.random;const ez=[],hd=[];ALLQ.forEach((_,i)=>(i%5<3?ez:hd).push(i));
  const take=(a,n)=>{const c=a.slice(),o=[];while(o.length<n){o.push(c.splice(Math.floor(rnd()*c.length),1)[0])}return o};
  const n=CH[lv].easy;return [...take(ez,n),...take(hd,5-n)]}
function playChallenge(ids,from,lv){
  lv=lv||(from&&from.lv)||QG.chLv||"m";const C=CH[lv];
  qQuiz({title:(from?`${from.name}'s challenge`:"Challenge")+" · "+C.n,qs:ids.map(i=>ALLQ[i]),level:"medium",pay:C.pay,timers:C.timers,onDone:r=>{
    let head=`You scored ${r.score} of 5`;
    if(from)head=r.score>from.score?`You win! ${r.score} to ${from.score}`:r.score===from.score?`It's a draw: ${r.score} each`:`${from.name} wins, ${from.score} to ${r.score}`;
    if(from&&r.score>from.score)QSFX.win();
    const sh=openSheet(`<h3>${esc(head)}</h3>
      <label>Your name (shown to your friend)<input id="chn" value="${esc(QG.meName||"")}" placeholder="e.g. Gideon"></label>
      <p class="sub">${from?"Send a challenge back with new questions, or send the same 5 to someone else.":"Send these same 5 questions to a friend. They see your score and try to beat it."}</p>
      <div class="row"><a class="btn wa" id="chsend" target="_blank" rel="noopener">Send on WhatsApp</a>${from?`<button class="btn" data-k="new">New 5 questions</button>`:""}<button class="btn" data-k="copy">Copy message</button><button class="btn" data-k="code">Copy code only</button><button class="btn" data-close>Close</button></div><div class="code" id="chc"></div>`);
    const msg=()=>`📖 Scripture Trail challenge (${C.n})! I scored ${r.score}/5. Can you beat me?\n\n1. Open Scripture Trail: ${SHORT_TRAIL}\n2. Tap *Play*, then *Enter a challenge code*\n3. Code: *${chCode(ids,r.score,lv)}*\n\n— from ${QG.meName||"Gideon"}`;
    const upd=()=>{QG.meName=sh.querySelector("#chn").value.trim();save();sh.querySelector("#chsend").href=wa(msg());sh.querySelector("#chc").textContent="Code: "+chCode(ids,r.score,lv)};upd();sh.querySelector("#chn").oninput=upd;
    sh.addEventListener("click",e=>{const k=e.target.closest("[data-k]")?.dataset.k;if(!k)return;
      if(k==="copy")copy(msg());
      if(k==="code")copy(chCode(ids,r.score,lv));
      if(k==="new"){sh.remove();playChallenge(chPick(lv),null,lv)}});
  }});
}

/* trail actions */
function trailAction(el){
  const a=el.dataset.q,v=el.dataset.v;
  switch(a){
    case "route":QG.pendRoute=v;document.querySelectorAll(".route").forEach(b=>b.classList.toggle("on",b.dataset.v===v));QSFX.tap();return true;
    case "pace":QG.pendPace=v;save();renderQuest();return true;
    case "startj":{const r=QG.pendRoute||(QG.journey&&QG.journey.route);if(!r){toast("Choose a journey first");return true}
      const pace=QG.pendPace||"y1";const bk=document.getElementById("q-book");QG.journey={route:r,pace,book:bk?+bk.value:0,start:today()};delete QG.pendRoute;save();QSFX.win();renderQuest();return true}
    case "changej":QG.journey.choosing=true;QG.pendRoute=QG.journey.route;QG.pendPace=QG.journey.pace;renderQuest();return true;
    case "canceljourney":delete QG.journey.choosing;renderQuest();return true;
    case "readdone":{const [b,c]=v.split("-").map(Number);const before=jTarget().done;setRead(b,c,true);QSFX.right();
      const rt=ROUTES.find(r=>r.id===QG.journey.route),{total}=jTarget(),N=rt.stops.length,st=d=>Math.floor(Math.min(1,d/total)*(N-1)+1e-9);
      if(st(before+1)>st(before)){QSFX.win();qAdd(15);toast(`You've reached ${rt.stops[st(before+1)]}! +15`)}
      renderQuest();chapterQuestion(b);return true}
    case "toggle":{const [b,c]=v.split("-").map(Number);setRead(b,c,!isRead(b,c));el.setAttribute("aria-pressed",isRead(b,c));QSFX.tap();return true}
    case "markbook":{const b=+v;for(let c=1;c<=BIBLE[b].c;c++)setRead(b,c,true);renderQuest();toast(BIBLE[b].n+" marked as read");return true}
    case "cert":certSheet();return true;
    case "challenge":playChallenge(chPick(QG.chLv||"m"),null,QG.chLv||"m");return true;
    case "chlv":QG.chLv=v;save();renderQuest();return true;
    case "chcode":{const c=chParse(document.getElementById("q-code").value);if(!c){toast("That code doesn't look right. Check it and try again.");return true}
      const sh=openSheet(`<h3>${esc(c.name)} challenged you!</h3><p class="sub" style="font-size:16px">${esc(c.name)} scored <b>${c.score} of 5</b> on ${CH[c.lv].n} level. Can you beat it?</p><button class="btn primary big" data-k="go">Play now</button><button class="btn" data-close>Later</button>`);
      sh.addEventListener("click",e=>{if(e.target.closest("[data-k=go]")){sh.remove();playChallenge(c.ids,c)}});return true}
    case "cotdplay":{const d=qDay();const ids=chPick("m",qRng(d*7919+17));
      qQuiz({title:"Challenge of the day",qs:ids.map(i=>ALLQ[i]),level:"medium",pay:5,timers:CH.m.timers,onDone:r=>{QG.cotdBest=QG.cotdBest||{};const k=today();if((QG.cotdBest[k]??-1)<r.score)QG.cotdBest[k]=r.score;save();if(r.score===5)QSFX.win();renderQuest();toast(`You scored ${r.score} of 5 today`)}});return true}
    case "memopen":memSheet();return true;
    case "convopen":convPlay();return true;
    case "memmake":memMake();return true;
    case "convmake":convMake();return true;
    case "seasonclear":if(el.dataset.sure){QG.mem=null;QG.conv=null;save();renderQuest()}else{el.dataset.sure=1;el.textContent="Tap again to clear"}return true;
  }
  return false;
}

  <input class="search" id="lib-q" type="search" placeholder="Search: Proverbs, friend, Jonah…" value="${esc(libQ)}">
  <div class="row"><button class="btn" data-a="libnew">+ Scripture insight</button><button class="btn" data-a="libchar">+ Bible character</button></div>
  ${items.length?books.map(b=>`<h4 style="margin-top:6px">${esc(b)}</h4><div class="list">${items.filter(x=>(x.book||"Other")===b).map(x=>`<div class="talk"><button class="head" data-a="libopen" data-id="${x.id}"><div><h3>${esc(x.title)}</h3><div class="meta">${x.kind==="character"?"Character study":"Scripture insight"} · ${fmtDate(x.d)}</div></div><span>${openTalk===x.id?"▴":"▾"}</span></button>
    ${openTalk===x.id?`<div class="body">${x.kind==="character"?charHtml(x.o,x.mode):insightHtml(x.o)}<div class="row"><a class="btn wa" href="${wa(x.kind==="character"?charText(x.o):insightText(x.v,x.k,x.o))}" target="_blank" rel="noopener">WhatsApp</a><button class="btn" data-a="libcopy" data-id="${x.id}">Copy</button><button class="btn danger" data-a="libdel" data-id="${x.id}">Delete</button></div></div>`:""}</div>`).join("")}</div>`).join(""):`<div class="empty">${S.lib.length?"Nothing matches your search.":"Your library is empty. Save a scripture insight or a character study and it will appear here."}</div>`}`;
  const qi=document.getElementById("lib-q");qi.oninput=e=>{libQ=e.target.value;const p=qi.selectionStart;renderLibrary();const n=document.getElementById("lib-q");n.focus();n.setSelectionRange(p,p)};
}
function charAction(a,el){
  const id=el.dataset.id;
  switch(a){
    case "openlib":go("library");return true;
    case "charstudy":charSheet("",tab==="ministry"?"ministry":"talk");return true;
    case "studycotd":charSheet(cotd()[0],"ministry");return true;
    case "lccotd":{const [n,r,,ask]=cotd();copy(`${fmtDate(today())} · Field service\nCharacter: ${n} (${r})\nOpener: ${ask}`);return true}
    case "libnew":insightSheet("","",null);return true;
    case "libchar":charSheet("","talk");return true;
    case "libopen":openTalk=openTalk===id?"":id;renderLibrary();return true;
    case "libcopy":{const x=S.lib.find(y=>y.id===id);copy(x.kind==="character"?charText(x.o):insightText(x.v,x.k,x.o));return true}
    case "libdel":if(el.dataset.sure){S.lib=S.lib.filter(y=>y.id!==id);save();renderLibrary()}else{el.dataset.sure=1;el.textContent="Tap again to delete"}return true;
  }
  return false;
}

/* ---------- Actions ---------- */
view.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a,id=el.dataset.id,v=el.dataset.v;
  if(ministryAction(a,el))return;
  if(charAction(a,el))return;
  const t=id&&talkById(id);
  switch(a){
    case "opentimer":go("timer");break;
    case "insight":insightSheet(t.scr||"","",t);break;
    case "delinsight":t.insights.splice(+v,1);save();renderTalks();break;
    case "backtalks":go("talks");break;
    case "theme":theme=v;renderBank();break;
    case "fav":{const i=S.fav.indexOf(id);i<0?S.fav.push(id):S.fav.splice(i,1);save();renderBank();break}
    case "totalk":pickTalk(id);break;
    case "more":moreSheet(id);break;
    case "twitoggle":twiOpen.has(id)?twiOpen.delete(id):twiOpen.add(id);renderBank();break;
    case "gomore":go("more");break;
    case "getfresh":getFresh();break;
    case "keep":{const b=fresh[+el.dataset.i];S.mine.unshift({t:b.t,h:b.h,s:b.s,p:b.p,r:b.r,id:"m"+Date.now(),mine:true});b.kept=true;save();el.textContent="Kept ✓";el.disabled=true;toast("Saved to your bank");break}
    case "copyfresh":copy(plain(fresh[+el.dataset.i]));break;
    case "addtalk":{const title=document.getElementById("t-title").value.trim();if(!title){toast("Type the talk title");return}
      const type=document.getElementById("t-type").value;
      const nt={id:"t"+Date.now(),title,date:document.getElementById("t-date").value,type,place:document.getElementById("t-place").value.trim(),scr:document.getElementById("t-scr").value.trim(),ill:[],notes:"",mins:DEFAULT_MINS[type]};
      S.talks.unshift(nt);openTalk=nt.id;save();renderTalks();toast("Talk added");break}
    case "opentalk":openTalk=openTalk===id?"":id;renderTalks();break;
    case "unlink":t.ill=t.ill.filter(x=>x!==v);save();renderTalks();break;
    case "findill":FR={theme:t.title,scr:t.scr||"",point:"",part:"",aud:t.type==="Public talk"?"Public talk":t.type==="Assembly part"?"Assembly or convention":"Congregation meeting",n:"3"};fresh=[];go("fresh");break;
    case "introconcl":introConcl(t);break;
    case "practise":T={...T,talkId:id,mins:t.mins||DEFAULT_MINS[t.type]||5,acc:0,running:false,b1:false,b0:false};go("timer");break;
    case "copytalk":copy(talkText(t));break;
    case "given":toggleGiven(t);break;
    case "deltalk":if(el.dataset.sure){S.talks=S.talks.filter(x=>x.id!==id);Object.keys(S.used).forEach(k=>S.used[k]=S.used[k].filter(u=>u.tid!==id));save();renderTalks();toast("Talk deleted")}else{el.dataset.sure=1;el.textContent="Tap again to delete"}break;
    case "mins":T.mins=+v;const tt=talkById(T.talkId);if(tt){tt.mins=T.mins;save()}T.b1=T.b0=false;renderTimer();break;
    case "tstart":if(T.running){T.acc+=Date.now()-T.start;T.running=false;lockOff()}else{T.start=Date.now();T.running=true;lockOn()}tick();break;
    case "treset":T.acc=0;T.running=false;T.b1=T.b0=false;lockOff();tick();break;
    case "tsave":{const x=talkById(T.talkId);if(x&&elapsed()>0){x.practice=elapsed();save();toast("Saved: "+fmtMs(x.practice))}break}
    case "addmine":{const g=k=>document.getElementById(k).value.trim();if(!g("m-h")||!g("m-s")){toast("Add a title and the story");return}
      S.mine.unshift({id:"m"+Date.now(),mine:true,t:g("m-t")||"My own",h:g("m-h"),s:g("m-s"),p:g("m-p"),r:g("m-r")});save();["m-h","m-t","m-s","m-p","m-r"].forEach(k=>document.getElementById(k).value="");toast("Saved to your bank");break}
    case "bkfile":saveBackupFile();break;
    case "bkshare":shareBackup();break;
    case "bkcopy":copy(backupText(),"bk-in");S.lastBackup=Date.now();save();break;
    case "bkload":restore(document.getElementById("bk-in").value);break;
    case "install":installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;renderMore()});break;
    case "update":checkUpdate();break;
    case "copylink":copy(SHORT_APK);break;
  }
});
view.addEventListener("input",e=>{const n=e.target.dataset.notes;if(n){const t=talkById(n);if(t){t.notes=e.target.value;save()}}});

function rerender(){({bank:renderBank,fresh:renderFresh,talks:renderTalks,timer:renderTimer,ministry:renderMinistry,more:renderMore,quest:renderQuest,library:renderLibrary})[tab]()}
function go(t){tab=t;if(t!=="talks"&&t!=="ministry")openTalk="";const hi=t==="timer"||t==="library"?"talks":t;document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===hi?"page":"false"));rerender();window.scrollTo(0,0)}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>go(b.dataset.tab));
if(questOnly){document.body.classList.add("questonly");document.getElementById("hdr-t").textContent="Scripture Trail";document.getElementById("hdr-s").textContent="Read, play and grow";document.title="Scripture Trail";go("quest");
  if(qIncoming){const c=qIncoming;const sh=openSheet(`<h3>${esc(c.name)} challenged you!</h3><p class="sub" style="font-size:16px">${esc(c.name)} scored <b>${c.score} of 5</b> on ${CH[c.lv].n} level. Answer the same 5 Bible questions. Can you beat it?</p><button class="btn primary big" data-k="go">Play now</button><button class="btn" data-close>Later</button>`);
    sh.addEventListener("click",e=>{if(e.target.closest("[data-k=go]")){sh.remove();playChallenge(c.ids,c)}})}}
else go("bank");
</script>
