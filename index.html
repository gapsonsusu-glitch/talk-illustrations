<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f4fd1"><link rel="manifest" href="manifest.json"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Illustrations"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Talk Illustrations</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
/* Layout: phone-first notecard app — sticky blue header, stacked cards, five-tab bottom bar, bottom sheets for actions */
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#14213d; --muted:#5b6782; --line:#dde3ef;
  --accent:#1f4fd1; --on-accent:#ffffff; --accent-soft:#e6edff; --mark:#f2b705; --mark-soft:#fff4cf;
  --ok:#1d8a5b; --warn:#b26a00; --bad:#c0392b; --wa:#1a8f4c;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --read:"Literata",Georgia,serif;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1324; --card:#151d33; --ink:#e8edf8; --muted:#9aa6c2; --line:#26304a;
  --accent:#7aa2ff; --on-accent:#0d1324; --accent-soft:#1c2a52; --mark:#f5c84a; --mark-soft:#3a3218;
  --ok:#4cc38a; --warn:#f0a43a; --bad:#ff7b6b; --wa:#4cc38a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1324; --card:#151d33; --ink:#e8edf8; --muted:#9aa6c2; --line:#26304a;
  --accent:#7aa2ff; --on-accent:#0d1324; --accent-soft:#1c2a52; --mark:#f5c84a; --mark-soft:#3a3218;
  --ok:#4cc38a; --warn:#f0a43a; --bad:#ff7b6b; --wa:#4cc38a; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--ui);font-size:15px;line-height:1.5;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#1f4fd1}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#1f4fd1;color:#fff}
header .wrap{padding-block:14px 12px;display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:10px;background:#fff;display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px}
header h1{font-family:var(--display);font-size:20px;margin:0;line-height:1.1;letter-spacing:-.01em}
header p{margin:0;font-size:12.5px;opacity:.85}
main .wrap{padding-block:16px;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--display);font-size:22px;margin:4px 0 0;text-wrap:balance}
h4{font-family:var(--display);font-size:15px;margin:0}
.sub{color:var(--muted);margin:0;font-size:14px}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrapit{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:999px;font:500 13.5px var(--ui);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:12px}
.ill{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ill .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ill h3{font-family:var(--display);font-size:18px;margin:0;line-height:1.25;text-wrap:balance}
.tag{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
.tag.mine{color:var(--ok)}
.story{font-family:var(--read);font-size:16px;line-height:1.6;margin:0}
.point{background:var(--mark-soft);border-radius:10px;padding:10px 12px;font-size:14.5px}
.point b{font-family:var(--display);font-weight:700}
.twi{border-left:3px solid var(--accent);padding:4px 0 4px 12px;font-family:var(--read);white-space:pre-wrap;font-size:15.5px}
.scr{font-size:14px;color:var(--muted)}
.scr a{color:var(--accent)}
.used{font-size:13px;color:var(--warn);font-weight:600}
.unused{font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font:500 13.5px var(--ui);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.wa{color:var(--wa);border-color:var(--wa)}
.btn.big{padding:13px 16px;font-size:15px;width:100%;justify-content:center}
.btn.danger{color:var(--bad)}
.star{border:none;background:none;font-size:20px;cursor:pointer;color:var(--muted);line-height:1;padding:2px}
.star[aria-pressed="true"]{color:var(--mark)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
label{font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:6px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;font-weight:400}
textarea{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.two{grid-template-columns:1fr}}
.note{font-size:13.5px;color:var(--ink);background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.note.warn{background:var(--mark-soft)}
.empty{text-align:center;color:var(--muted);padding:28px 12px;border:1px dashed var(--line);border-radius:14px}
.talk{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.talk>button.head{all:unset;box-sizing:border-box;width:100%;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.talk>button.head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.talk h3{font-family:var(--display);margin:0;font-size:17px;line-height:1.25}
.talk .meta{font-size:13px;color:var(--muted)}
.talk .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.talk ol{margin:0;padding-left:20px;font-size:14.5px;display:flex;flex-direction:column;gap:6px}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--ok)}
.pill.soon{background:var(--mark-soft);color:var(--warn)}
.block{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14.5px;font-family:var(--read)}
.block b{font-family:var(--ui);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:none;background:none;color:var(--muted);font:600 11.5px var(--ui);padding:10px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.sheet{position:fixed;inset:0;background:rgba(10,15,30,.55);z-index:15;display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow:auto}
.sheet h3{font-family:var(--display);margin:0;font-size:19px}
.sheet .list-btn{text-align:left;justify-content:flex-start;width:100%;padding:12px}
.steps{margin:0;padding-left:20px;font-size:14.5px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .8s linear infinite;vertical-align:-3px}
@keyframes s{to{transform:rotate(360deg)}}
pre.prompt{white-space:pre-wrap;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin:0;max-height:140px;overflow:auto}
.clock{font-family:var(--display);font-weight:700;font-size:clamp(64px,22vw,120px);line-height:1;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--ink);padding-block:8px}
.clock.soon{color:var(--warn)}
.clock.over{color:var(--bad)}
.clock-sub{text-align:center;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
details summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent)}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.toast{transition:none}}
</style>

<header><div class="wrap">
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#1f4fd1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.8V16h5v-.3c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3z"/></svg></div>
  <div><h1>Talk Illustrations</h1><p>Make the point stick</p></div>
</div></header>

<main><div class="wrap" id="view"></div></main>

<nav class="tabs" aria-label="Sections"><div class="wrap">
  <button data-tab="bank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5h6v14H4zM14 5h6v14h-6z"/></svg>Bank</button>
  <button data-tab="fresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></svg>Fresh ideas</button>
  <button data-tab="talks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5 11a7 7 0 0 0 14 0M12 18v3"/></svg>My talks</button>
  <button data-tab="ministry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM19 17H6"/><path d="M11.5 6.5v6M9 9h5"/></svg>Ministry</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</button>
</div></nav>
<div class="toast" id="toast" role="status"></div>

<script>
const VERSION="4.1";
const APK_URL="https://github.com/gapsonsusu-glitch/talk-illustrations/releases/latest/download/talk-illustrations.apk";
const RELEASES_URL="https://github.com/gapsonsusu-glitch/talk-illustrations/releases/latest";
const isNative=()=>!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
const APP_URL_DEFAULT="https://gapsonsusu-glitch.github.io/talk-illustrations/";
const BANK=[
{t:"Faith",h:"The trotro driver you never questioned",s:"You board a trotro to Kasoa at dawn. You can't see the road ahead from the back seat, and you don't know the driver's name, yet you sit back and even sleep. Why? Because he has made that trip many times and you have seen him arrive.",p:"Real faith isn't blind. It rests on a track record, and Jehovah's record of keeping his word is perfect.",r:"Hebrews 11:1; Joshua 23:14"},
{t:"Faith",h:"Saying the chair is strong",s:"Anyone can stand beside a plastic chair and say, \"It will hold me.\" But you only show you believe it when you actually sit down on it.",p:"Faith is shown by what we do, not only by what we say.",r:"James 2:17, 18"},
{t:"Faith",h:"Planting before the rains",s:"A farmer in the north plants his seed in dry, hard ground before a single drop has fallen. He isn't foolish. He has watched the seasons for years and knows the rains will come.",p:"We act now on Jehovah's promises because we know his 'seasons' never fail.",r:"Hebrews 11:6; Habakkuk 2:3"},
{t:"Prayer",h:"A network that is never busy",s:"Sometimes you call and hear, \"The number you are calling is not reachable,\" or the network drops at the worst moment. But you can speak to Jehovah at midnight, on the road, in the market, and the line is never busy.",p:"Jehovah is always reachable. We can pray anytime, about anything.",r:"Psalm 65:2; 1 Thessalonians 5:17"},
{t:"Prayer",h:"The friend who only calls for money",s:"Imagine a friend who only phones you when he needs a loan. Every call starts with \"Please, I need small help.\" How close would you feel to him?",p:"Our prayers should include thanks and praise, not only requests.",r:"Philippians 4:6; Colossians 3:15"},
{t:"Prayer",h:"Holding Daddy's hand at the lorry station",s:"A small child crossing the busy road at a lorry station doesn't study the traffic. He just holds his father's hand tightly and walks when his father walks.",p:"In prayer we hold Jehovah's hand through situations too big for us.",r:"Isaiah 41:10, 13"},
{t:"Endurance",h:"Watering the concrete",s:"After a mason casts a slab, he keeps pouring water on it for days. A visitor might think the concrete is being troubled. In fact, that slow curing is what makes it strong enough to carry a whole storey.",p:"Trials we endure faithfully make our faith stronger and more useful.",r:"James 1:2-4; 1 Peter 1:6, 7"},
{t:"Endurance",h:"The palm tree in the harmattan",s:"When strong winds blow, the palm tree bends far over, almost touching the ground. But its roots go deep, and after the storm it stands straight again.",p:"Deep roots in God's Word let us bend under pressure without breaking.",r:"Psalm 92:12-14; Colossians 2:6, 7"},
{t:"Endurance",h:"The runner who sees the finish line",s:"In a long race, the runners who finish are not always the fastest at the start. They are the ones who keep a steady pace and keep their eyes on the finish line.",p:"Endurance is about steady faithfulness to the end, not a fast start.",r:"Hebrews 12:1, 2; Matthew 24:13"},
{t:"Love",h:"The plate kept warm",s:"A mother keeps a plate of food covered and warm for the child who comes home late, even when she is tired. Nobody asked her to. Love made her think ahead.",p:"Love looks for the needs of others before they ask.",r:"1 Corinthians 13:4, 5; Philippians 2:4"},
{t:"Love",h:"Lights off, generator on",s:"When there is 'dumsor' and the whole street goes dark, you quickly see which house has a generator. Anyone can shine when there is power.",p:"Love is proved when things are hard, by actions and not just words.",r:"1 John 3:18; Proverbs 17:17"},
{t:"Love",h:"The right hand washes the left",s:"Our elders say the right hand washes the left and the left washes the right. Neither hand can get clean alone.",p:"In the congregation we need each other and take turns giving help.",r:"Romans 12:10; Galatians 6:2"},
{t:"Forgiveness",h:"Tearing out the debt page",s:"A shopkeeper keeps a notebook of who owes her. One day, moved by a customer's hardship, she tears out his page completely. She doesn't just put it aside to remind him later.",p:"When Jehovah forgives, he cancels the debt. We should forgive the same way.",r:"Colossians 3:13; Psalm 103:12"},
{t:"Forgiveness",h:"A stone in your pocket",s:"Pick up a stone each time someone offends you and carry it in your pocket. After a few weeks you can hardly walk. The person who hurt you feels nothing; you carry all the weight.",p:"Holding a grudge hurts us most. Letting go brings relief.",r:"Ephesians 4:31, 32"},
{t:"Forgiveness",h:"The cleaned chalkboard",s:"At the end of the lesson, the teacher wipes the board completely clean. The next class starts with nothing of yesterday's writing on it.",p:"Jehovah's forgiveness wipes the record clean.",r:"Isaiah 1:18; Acts 3:19"},
{t:"Humility",h:"The branch full of fruit",s:"Look at a mango tree in season. The branches heavy with fruit bend low to the ground. The empty branches point straight up.",p:"The more we truly have to offer, the lower we should bow.",r:"Proverbs 22:4; 1 Peter 5:5"},
{t:"Humility",h:"The empty barrel",s:"Knock on a full barrel and you hear a dull sound. Knock on an empty one and it booms loudly.",p:"Loud self-praise often shows emptiness. Let our works speak.",r:"Proverbs 27:2; Proverbs 11:2"},
{t:"Family",h:"The part of the building nobody sees",s:"Visitors admire the paint, the ceiling and the tiles. Nobody praises the foundation buried in the ground, yet without it the whole house would crack.",p:"Spiritual routine at home is the hidden foundation of a strong family.",r:"Psalm 127:1; Matthew 7:24, 25"},
{t:"Family",h:"Three strands in one rope",s:"Try to snap one thin strand of rope and it breaks easily. Twist three together and you cannot break it with your hands.",p:"A marriage with Jehovah in it is far stronger than two people alone.",r:"Ecclesiastes 4:12"},
{t:"Family",h:"Watering a seedling every day",s:"You can't water a seedling once a month with a big bucket and expect it to grow. It needs a little water every day.",p:"Children grow spiritually through small, daily teaching, not occasional lectures.",r:"Deuteronomy 6:6, 7; Ephesians 6:4"},
{t:"Ministry",h:"The fisherman comes back tomorrow",s:"A fisherman at Winneba may pull in an empty net. He doesn't burn his canoe. He mends the net and goes out again tomorrow.",p:"Results in the ministry belong to Jehovah. Our part is to keep going out.",r:"Galatians 6:9; 1 Corinthians 3:6, 7"},
{t:"Ministry",h:"The seller who uses her own product",s:"The shea butter seller whose own skin glows doesn't need to shout. People see the results on her and ask where to buy.",p:"Living the truth makes our preaching believable.",r:"1 Peter 2:12; Romans 1:16"},
{t:"Ministry",h:"One lamp in a dark compound",s:"During a power cut, one lit lamp in the middle of the compound draws everyone. People gather around it to see.",p:"Our good conduct and message give light in a dark world.",r:"Matthew 5:14-16; Philippians 2:15"},
{t:"Hope",h:"The phone that goes off",s:"When your phone battery dies, the screen goes dark, but your contacts and photos are safe in your account. Charge it, and everything comes back.",p:"Those who die are safe in Jehovah's memory, ready for the resurrection.",r:"John 5:28, 29; Job 14:13-15"},
{t:"Hope",h:"Seeing the house plan",s:"Before a family moves into a new house, they study the building plan and talk about which room will be whose. They are excited because the builder is reliable.",p:"Bible promises are a reliable 'plan' of the new world we can already picture.",r:"Revelation 21:3, 4; 2 Peter 3:13"},
{t:"Hope",h:"Ticket in hand at the station",s:"At the bus station, the person holding a ticket waits calmly even if the bus is late. The one without a ticket keeps worrying.",p:"Jehovah's promises are our 'ticket'. We can wait with calm hope.",r:"Habakkuk 2:3; Romans 5:5"},
{t:"Choices",h:"When the GPS says recalculating",s:"You take a wrong turn and the GPS doesn't shout at you. It calmly says \"recalculating\" and shows the way back to the road.",p:"Jehovah's Word guides us, and helps us return when we go off course.",r:"Psalm 119:105; Isaiah 30:21"},
{t:"Choices",h:"The shortcut through the bush",s:"A path through the bush looks shorter than the main road. But it may lead to a swamp or snakes, and you end up far later than those on the road.",p:"A way that seems right can end badly. Trust Jehovah's road.",r:"Proverbs 14:12; Proverbs 3:5, 6"},
{t:"Choices",h:"One bad tomato in the basket",s:"Leave one rotten tomato in a basket overnight. By morning, the good ones around it have started to spoil. The good ones never make the bad one fresh.",p:"Bad company spoils good habits. Choose friends carefully.",r:"1 Corinthians 15:33; Proverbs 13:20"},
{t:"Bible study",h:"Eating once a week",s:"Imagine someone who eats one big meal on Sunday and nothing else all week. By Wednesday he is weak and dizzy, however big Sunday's meal was.",p:"We need regular personal Bible reading, not only meetings.",r:"Matthew 4:4; Psalm 1:2, 3"},
{t:"Bible study",h:"Reading the manufacturer's manual",s:"When a new generator gives trouble, the wise man reads the manual written by the people who made it, not the advice of a passer-by.",p:"Our Maker's book tells us how life works best.",r:"2 Timothy 3:16, 17; Isaiah 48:17"},
{t:"Obedience",h:"The hard hat on site",s:"A new labourer may find the hard hat hot and annoying. Then one day a piece of block falls from the scaffold, and he understands the rule.",p:"Jehovah's laws protect us even when we can't yet see the danger.",r:"Isaiah 48:17, 18; Psalm 19:7-11"},
{t:"Obedience",h:"Following the doctor's prescription",s:"A patient feels better after two days and stops the medicine. A week later the sickness returns, stronger than before.",p:"Obeying fully, not just when it feels needed, keeps us spiritually healthy.",r:"Proverbs 3:7, 8; James 1:22"},
{t:"Jehovah's care",h:"The hen and her chicks",s:"When a hawk circles over the farm, the mother hen gives one sharp call and every chick runs under her wings. She spreads herself over them, ready to take the attack.",p:"Jehovah protects those who run to him.",r:"Psalm 91:4; Matthew 23:37"},
{t:"Jehovah's care",h:"The shepherd counts again",s:"A shepherd counts 99 sheep at the end of the day. He doesn't say, \"That's enough.\" He goes back out in the dark for the one that is missing.",p:"Every single one of us matters to Jehovah.",r:"Luke 15:4-7; Ezekiel 34:11, 12"},
{t:"Contentment",h:"The monkey's hand in the jar",s:"Hunters put groundnuts in a jar with a narrow neck. The monkey reaches in and grabs a fistful, but now his fist is too big to come out. He won't let go, and he is caught.",p:"Greed traps us. Contentment sets us free.",r:"Luke 12:15; 1 Timothy 6:6-10"},

let sampleP=null;
function getSample(){if(!sampleP)sampleP=(window.claude&&window.claude.use)?window.claude.use("sample").catch(()=>null):Promise.resolve(null);return sampleP}
function parseJSON(text){
  let t=String(text||"").replace(/```(?:json)?/gi,"").trim();
  const a=t.search(/[\[{]/);if(a<0)throw new Error("no json");
  const open=t[a],close=open==="["?"]":"}";const b=t.lastIndexOf(close);
  return JSON.parse(t.slice(a,b+1));
}
function openSheet(html){
  const sh=document.createElement("div");sh.className="sheet";
  sh.innerHTML=`<div class="box" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(sh);
  sh.addEventListener("click",e=>{if(e.target===sh||e.target.closest("[data-close]"))sh.remove()});
  return sh;
}
function busy(label){const sh=openSheet(`<p style="margin:8px 0;font-size:16px"><span class="spin"></span>&nbsp; ${esc(label)}</p>`);return()=>sh.remove()}
function manualAsk(prompt,json){
  return new Promise((res,rej)=>{
    const link=prompt.length<6000?"https://claude.ai/new?q="+encodeURIComponent(prompt):"https://claude.ai/new";
    const sh=openSheet(`<h3>Ask Claude</h3>
      <p class="sub">In the installed app this takes 3 quick steps:</p>
      <ol class="steps"><li>Copy the request.</li><li>Open Claude, paste it (if it isn't already there) and send.</li><li>Copy Claude's whole answer and paste it below.</li></ol>
      <div class="row"><button class="btn primary" data-k="copy">1. Copy request</button><a class="btn" href="${link}" target="_blank" rel="noopener">2. Open Claude</a></div>
      <pre class="prompt" id="ask-pr">${esc(prompt)}</pre>
      <label>3. Paste Claude's answer here<textarea id="ask-in" placeholder="Paste the answer"></textarea></label>
      <div id="ask-err"></div>
      <div class="row"><button class="btn primary" data-k="use">Use answer</button><button class="btn" data-k="cancel">Cancel</button></div>`);
    sh.addEventListener("click",e=>{
      if(e.target===sh){rej({code:"cancel"});return}
      const k=e.target.closest("[data-k]")?.dataset.k;if(!k)return;
      if(k==="copy")copy(prompt,"ask-pr");
      if(k==="cancel"){sh.remove();rej({code:"cancel"})}
      if(k==="use"){
        const v=sh.querySelector("#ask-in").value.trim();
        if(!v){sh.querySelector("#ask-err").innerHTML=`<div class="note warn">Paste Claude's answer first.</div>`;return}
        if(!json){sh.remove();res(v);return}
        try{const out=parseJSON(v);sh.remove();res(out)}
        catch(err){sh.querySelector("#ask-err").innerHTML=`<div class="note warn">That answer couldn't be read. Make sure you copied all of Claude's reply, from the first [ or { to the end.</div>`}
      }
    });
  });
}
async function aiRun(prompt,json,label){
  const s=await getSample();
  if(s){
    const close=busy(label||"Asking Claude…");
    try{const out=json?await s.json(prompt,{modelTier:"default"}):(await s(prompt,{modelTier:"default"})).text;close();return out}
    catch(e){close();if(e&&e.code==="not_granted")return manualAsk(prompt,json);throw e}
  }
  return manualAsk(prompt,json);
}
function aiError(e){
  if(e&&e.code==="cancel")return;
  toast(e&&e.code==="rate_limited"?"Too many requests just now. Wait a minute and try again.":"Couldn't get an answer. Check your internet and try again.");
}

let T={mins:5,acc:0,start:0,running:false,talkId:"",b1:false,b0:false},wakeLock=null;
const elapsed=()=>T.acc+(T.running?Date.now()-T.start:0);
function fmtMs(ms){const s=Math.floor(Math.abs(ms)/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
async function lockOn(){try{wakeLock=await navigator.wakeLock?.request("screen")}catch(e){}}
function lockOff(){try{wakeLock&&wakeLock.release();wakeLock=null}catch(e){}}
function renderTimer(){
  view.innerHTML=`<button class="btn" data-a="backtalks" style="align-self:flex-start">← My talks</button><h2>Practise your talk</h2>
  <div class="panel">
    <label>Talk (optional)<select id="tm-talk"><option value="">— Just a timer —</option>${S.talks.filter(t=>!t.given).map(t=>`<option value="${t.id}" ${t.id===T.talkId?"selected":""}>${esc(t.title)}</option>`).join("")}</select></label>
    <div class="chips wrapit">${[3,4,5,10,15,30,45].map(m=>`<button class="chip" data-a="mins" data-v="${m}" aria-pressed="${m===T.mins}">${m} min</button>`).join("")}</div>
    <div id="clock" class="clock">0:00</div>
    <div id="clock-sub" class="clock-sub"></div>
    <div class="two"><button class="btn primary big" data-a="tstart" id="tstart">Start</button><button class="btn big" data-a="treset">Reset</button></div>
    ${T.talkId?`<button class="btn" data-a="tsave">Save this practice time to the talk</button>`:""}
    <p class="sub">The clock turns orange in the last minute and red when you go over. The phone vibrates at 1 minute left and at time up.</p>

  tick();
}
function tick(){
  const el=elapsed(),rem=T.mins*60000-el;
  if(T.running){if(rem<=60000&&!T.b1){T.b1=true;vib(250)}if(rem<=0&&!T.b0){T.b0=true;vib([500,200,500])}}
  if(tab!=="timer")return;
  const c=document.getElementById("clock");if(!c)return;
  c.textContent=(rem<0?"+":"")+fmtMs(rem);
  c.className="clock"+(rem<0?" over":rem<=60000&&el>0?" soon":"");
  document.getElementById("clock-sub").textContent=rem<0?`Over time · spoken ${fmtMs(el)}`:`left of ${T.mins} min · spoken ${fmtMs(el)}`;
  const b=document.getElementById("tstart");if(b)b.textContent=T.running?"Pause":el>0?"Continue":"Start";
}

async function nativeBackup(){
  try{const P=window.Capacitor.Plugins;const path=backupName();
    await P.Filesystem.writeFile({path,data:backupText(),directory:"CACHE",encoding:"utf8"});
    const {uri}=await P.Filesystem.getUri({path,directory:"CACHE"});
    await P.Share.share({title:"Talk Illustrations backup",files:[uri]});
    S.lastBackup=Date.now();save();renderMore();
  }catch(e){if(!/cancel/i.test(String(e&&e.message)))toast("Couldn't send the backup. Use “Copy backup text” instead.")}
}
async function saveBackupFile(){
  if(isNative())return nativeBackup();
  const text=backupText();
  try{const d=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
    if(d){const r=await d.save({filename:backupName(),data:text});if(r&&r.status){S.lastBackup=Date.now();save();renderMore();toast("Backup saved")}return}}catch(e){if(e&&e.code&&e.code!=="unavailable"){toast("Backup not saved");return}}
  try{const url=URL.createObjectURL(new Blob([text],{type:"application/json"}));const a=document.createElement("a");a.href=url;a.download=backupName();document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);S.lastBackup=Date.now();save();renderMore();toast("Backup saved to Downloads")}
  catch(e){toast("Couldn't save the file. Use “Copy backup text” instead.")}
}
async function shareBackup(){
  if(isNative())return nativeBackup();

    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Talk Illustrations backup"});S.lastBackup=Date.now();save();renderMore();return}}catch(e){if(e&&e.name==="AbortError")return}
  toast("Sending files isn't possible here. Use “Save backup file”.");
}
function restore(text){
  try{
    const o=JSON.parse(text);const d=o.data||o;if(!Array.isArray(d.talks)||!Array.isArray(d.mine))throw 0;
    const mids=new Set(S.mine.map(m=>m.id));d.mine.forEach(m=>{if(!mids.has(m.id))S.mine.push(m)});
    S.fav=[...new Set([...S.fav,...(d.fav||[])])];
    d.talks.forEach((t,i)=>{t.id=t.id||("t"+Date.now()+i);const j=S.talks.findIndex(x=>x.id===t.id);if(j<0)S.talks.push(t);else S.talks[j]=t});
    Object.entries(d.used||{}).forEach(([id,arr])=>{const cur=S.used[id]||[];arr.forEach(u=>{if(!cur.some(c=>c.d===u.d&&c.w===u.w))cur.push(u)});S.used[id]=cur});
    (d.kept||[]).forEach(k=>{S.kept=S.kept||[];if(!S.kept.some(x=>x.r===k.r&&x.open===k.open))S.kept.push(k)});
    (d.plans||[]).forEach(p=>{S.plans=S.plans||[];if(!S.plans.some(x=>x.id===p.id))S.plans.push(p)});
    Object.entries(d.extra||{}).forEach(([id,x])=>S.extra[id]={...x,...(S.extra[id]||{})});
    S.talks.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    save();renderMore();toast("Backup restored");
  }catch(e){toast("That isn't a Talk Illustrations backup")}
}

const dayNo=()=>Math.floor((new Date(today()+"T00:00")-new Date("2026-01-01T00:00"))/864e5);
function todayThree(){const d=dayNo(),n=FS_BANK.length;return [0,1,2].map(k=>FS_BANK[((d*3+k)%n+n)%n])}
const todayAdage=()=>ADAGES[((dayNo())%ADAGES.length+ADAGES.length)%ADAGES.length];
const lcText=x=>`${fmtDate(today())} · Field service\nScripture: ${x.r}${x.key?` (“${x.key}”)`:""}\nOpener: ${x.open||x.ask||""}\nQuestion left: ${x.follow||""}`;
const fsPlain=x=>`*${x.r}* — “${x.key}”\n${x.angle}\n\nOpen: ${x.open}\nRead: ${x.read}\nThen ask: ${x.follow}${x.root?"\n\nOriginal language: "+x.root:""}${x.pic?"\nGhana picture: "+x.pic:""}${x.video?"\nVideo: "+x.video:""}`;
const isKept=x=>(S.kept||[]).some(k=>k.r===x.r&&k.open===x.open);
const fsList=src=>src==="today"?todayThree():src==="kept"?(S.kept||[]):FS[src];
const adPlain=a=>`*${a.tw}*\n(${a.en})\n\nAsk: ${a.ask}\nTwist: ${a.twist}\nScripture: ${a.r}`;
function fsCard(x,src,i){
  return `<article class="ill">
    <div class="tag">${esc(x.who||"Field service")}</div>
    <h3>📖 <a href="${wol(x.r)}" target="_blank" rel="noopener" style="color:inherit">${esc(x.r)}</a></h3>
    <div class="point"><b>Key words:</b> “${esc(x.key)}”<br>${esc(x.angle)}</div>
    ${x.tw?`<div class="twi">${esc(x.tw)}${x.en?`\n(${esc(x.en)})`:""}</div>`:""}
    <div class="block"><b>Open with</b>${esc(x.open)}</div>
    <div class="block"><b>Lead into the verse</b>${esc(x.read)}</div>
    <div class="block"><b>Then ask</b>${esc(x.follow)}</div>
    ${x.root?`<div class="block"><b>In the original language</b>${esc(x.root)}</div>`:""}
    ${x.pic?`<div class="block"><b>Ghana picture</b>${esc(x.pic)}</div>`:""}
    <div class="scr">🎬 <a href="${jwSearch(x.vsearch||x.video||FS_VID[x.r]||x.key)}" target="_blank" rel="noopener">${x.video?esc(x.video):"Find a short video on this topic"}</a></div>
    <div class="row"><button class="btn primary" data-a="lc" data-v="${src}" data-i="${i}">Copy for Life Compass</button>
    ${src==="kept"?`<button class="btn danger" data-a="unkeep" data-i="${i}">Remove</button>`:`<button class="btn" data-a="fskeep" data-v="${src}" data-i="${i}" ${isKept(x)?"disabled":""}>${isKept(x)?"Kept ✓":"Keep"}</button>`}
    <button class="btn" data-a="deeper" data-v="${src}" data-i="${i}">Go deeper</button>
    <a class="btn wa" href="${wa(fsPlain(x))}" target="_blank" rel="noopener">WhatsApp</a></div>
  </article>`;
}
function adageCard(a){
  return `<article class="ill">
    <div class="tag">Today's adage opener</div>
    <div class="twi" style="font-size:17px;font-weight:600">${esc(a.tw)}</div>

    <div class="block"><b>Ask</b>${esc(a.ask)}</div>
    <div class="point"><b>The twist:</b> ${esc(a.twist)}</div>
    <div class="scr">📖 <a href="${wol(a.r)}" target="_blank" rel="noopener">${esc(a.r)}</a></div>
    <div class="row"><button class="btn primary" data-a="lc" data-v="adage" data-i="0">Copy for Life Compass</button>
    <a class="btn wa" href="${wa(adPlain(a))}" target="_blank" rel="noopener">WhatsApp</a></div>
    <p class="sub" style="font-size:13px">Check the Twi wording before you use it.</p>

function renderMinistry(){
  const seg=[["today","Today"],["someone","I see someone"],["kept","Kept"+((S.kept||[]).length?" ("+S.kept.length+")":"")],["meeting","Service meeting"],["family","Family worship"]];
  let body="";
  if(mtab==="today"){
    body=`<p class="sub">${new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})} · three scriptures we rarely use, each with a fresh angle. They change every day.</p>
    <div class="list">${todayThree().map((x,i)=>fsCard(x,"today",i)).join("")}${adageCard(todayAdage())}</div>
    <button class="btn primary big" data-a="fsmore">Give me 3 more</button>
    <div class="list" id="fs-more">${FS.more.map((x,i)=>fsCard(x,"more",i)).join("")}</div>`;
  }else if(mtab==="someone"){
    body=`<div class="panel">
      <label>Who did you meet, and where?<input id="ms-who" placeholder="e.g. neatly dressed man in a trotro" value="${esc(MS.who)}"></label>
      <div class="chips wrapit">${["Neatly dressed man in a trotro","Mechanic at his shop","Market woman selling tomatoes","Student going to school","Elderly man under a tree","Nurse on her way to work","Young couple with a baby","Taxi driver waiting at the station"].map(s=>`<button class="chip" data-a="mswho" data-v="${esc(s)}">${esc(s)}</button>`).join("")}</div>
      <label>How do you want to start?<select id="ms-style">${["Any","With a Ghanaian adage","With a question","With a sincere compliment","With something in the news"].map(s=>`<option ${s===MS.style?"selected":""}>${s}</option>`).join("")}</select></label>
      <button class="btn primary big" data-a="msgo">Give me openers</button>
    </div>
    <div class="list" id="ms-out">${FS.someone.map((x,i)=>fsCard(x,"someone",i)).join("")}</div>`;
  }else if(mtab==="kept"){
    body=(S.kept||[]).length?`<p class="sub">Openers you kept. They work without internet.</p><div class="list">${S.kept.map((x,i)=>fsCard(x,"kept",i)).join("")}</div>`:`<div class="empty">No kept openers yet. Tap “Keep” on any scripture or opener you like.</div>`;
  }else if(mtab==="meeting"){
    body=`<p class="sub">Type the topic. You get quick notes, a short outline, and jw.org articles and videos to choose from.</p>
    <div class="panel">
      <label>Topic<input id="mt-topic" placeholder="e.g. Starting conversations in public places" value="${esc(MS.topic||"")}"></label>
      <label>Lesson from “Love People—Make Disciples” (optional)<input id="mt-sec" placeholder="e.g. Lesson 4, point 3" value="${esc(MS.sec)}"></label>
      <label>Other publications to draw from (optional)<input id="mt-other" placeholder="e.g. Enjoy Life Forever! lesson 5, a recent Watchtower article" value="${esc(MS.other||"")}"></label>
      <details ${FS.meetingText?"open":""}><summary>Add the lesson material (optional)</summary><div style="display:flex;flex-direction:column;gap:10px;margin-top:10px">
      <label>Upload a PDF or text file from jw.org<input id="mt-file" type="file" accept=".pdf,.txt,text/plain,application/pdf"></label>
      <label>Or paste it<textarea id="mt-text" placeholder="Copy the lesson's points from JW Library and paste here">${esc(FS.meetingText)}</textarea></label></div></details>
      <div class="two">
        <label>Today's ministry<select id="mt-focus">${["House-to-house","Public witnessing (cart)","Return visits","Bible studies","Business territory","Phone and letters"].map(s=>`<option ${s===MS.focus?"selected":""}>${s}</option>`).join("")}</select></label>
        <label>Meeting length<select id="mt-mins">${["5","7","10","15"].map(s=>`<option ${s===MS.mins?"selected":""}>${s}</option>`).join("")}</select></label>
      </div>
      <button class="btn primary big" data-a="mtgo">Get notes and references</button>
    </div>
    <div id="mt-out">${FS.meeting?planCard("meeting",FS.meeting):""}</div>
    ${savedPlans("meeting")}`;
  }else{
    body=`<p class="sub">Get a short summary, a brief outline, and jw.org articles and videos to choose from. You decide the rest.</p>
    <div class="panel">
      <label>The family<input id="fw-fam" placeholder="e.g. Father, mother, boy 12, girl 7" value="${esc(MS.fam)}"></label>
      <label>Topic (optional)<input id="fw-topic" placeholder="e.g. contentment, honesty at school" value="${esc(MS.ftopic||"")}"></label>
      <label>What are they facing or interested in? (optional)<input id="fw-face" placeholder="e.g. bullying at school, new in the truth, loves football" value="${esc(MS.face)}"></label>
      <label>Time<select id="fw-mins">${["30","45","60"].map(s=>`<option ${s===MS.fmins?"selected":""}>${s} min</option>`).join("")}</select></label>
      <button class="btn primary big" data-a="fwgo">Get notes and references</button>
    </div>
    <div id="fw-out">${FS.family?planCard("family",FS.family):""}</div>
    <details class="panel"><summary>Quick activity ideas (work offline)</summary><ol class="steps" style="margin-top:10px">${FW_QUICK.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></details>
    ${savedPlans("family")}`;
  }
  view.innerHTML=`<h2>Ministry</h2>
  <div class="chips">${seg.map(([k,l])=>`<button class="chip" data-a="mtab" data-v="${k}" aria-pressed="${k===mtab}">${l}</button>`).join("")}</div>${body}`;
  const bind=(id,k,obj)=>{const el=document.getElementById(id);if(el)el.oninput=el.onchange=e=>obj[k]=e.target.value};
  bind("ms-who","who",MS);bind("mt-topic","topic",MS);bind("fw-topic","ftopic",MS);bind("ms-style","style",MS);bind("mt-sec","sec",MS);bind("mt-focus","focus",MS);bind("mt-mins","mins",MS);
  bind("mt-text","meetingText",FS);bind("mt-other","other",MS);bind("fw-fam","fam",MS);bind("fw-face","face",MS);
  const fm=document.getElementById("fw-mins");if(fm)fm.onchange=e=>MS.fmins=e.target.value.split(" ")[0];
  const mf=document.getElementById("mt-file");if(mf)mf.onchange=e=>loadMaterial(e.target.files[0]);
}
function savedPlans(kind){
  const ps=(S.plans||[]).filter(p=>p.kind===kind);
  if(!ps.length)return "";
  return `<h4>Saved plans</h4><div class="list">${ps.map(p=>`<div class="talk"><button class="head" data-a="openplan" data-id="${p.id}"><div><h3>${esc(p.obj.title||p.obj.theme||"Plan")}</h3><div class="meta">${fmtDate(p.d)}</div></div><span>${openTalk===p.id?"▴":"▾"}</span></button>${openTalk===p.id?`<div class="body">${planInner(kind,p.obj)}<div class="row"><a class="btn wa" href="${wa(planText(kind,p.obj))}" target="_blank" rel="noopener">WhatsApp</a><button class="btn danger" data-a="delplan" data-id="${p.id}">Delete</button></div></div>`:""}</div>`).join("")}</div>`;
}
function resLink(r){return `<a href="${jwSearch(r.search||r.title)}" target="_blank" rel="noopener">${r.type==="video"?"🎬":"📄"} ${esc(r.title)}</a>`}
function resList(o,pickable,kind){
  const rs=o.resources||[];if(!rs.length)return "";
  const picked=o.picked||[];
  const items=pickable?rs.map((r,i)=>({r,i})):rs.map((r,i)=>({r,i})).filter(x=>!pickable&&(o.picked?picked.includes(x.i):true));
  if(!items.length)return "";
  return `<div class="block"><b>${pickable?"Pick the articles and videos to use":o.picked?"Chosen articles and videos":"Articles and videos"}</b><div style="display:flex;flex-direction:column;gap:8px;margin-top:4px">${items.map(({r,i})=>`<div>${pickable?`<button class="btn" style="padding:3px 9px" data-a="pickres" data-v="${kind||"family"}" data-i="${i}" aria-pressed="${picked.includes(i)}">${picked.includes(i)?"✓ Chosen":"Choose"}</button> `:""}${resLink(r)}${r.why?`<div class="meta" style="font-family:var(--ui);font-size:13px;color:var(--muted)">${esc(r.why)}</div>`:""}</div>`).join("")}</div></div>`;
}
const resText=o=>{const rs=(o.resources||[]).filter((r,i)=>!o.picked||o.picked.includes(i));return rs.length?"\n\nArticles and videos:\n"+rs.map(r=>`• ${r.title}${r.why?" — "+r.why:""}\n  ${jwSearch(r.search||r.title)}`).join("\n"):""};
function briefInner(o,pickable,kind){
  const L=(l,a)=>a&&a.length?`<div class="block" style="font-family:var(--ui)"><b>${l}</b><ul class="steps" style="padding-left:18px">${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:"";
  return L("Summary",o.summary)+L("Outline",o.outline)+((o.scriptures||[]).length?`<div class="scr">📖 ${o.scriptures.map(r=>`<a href="${wol(r)}" target="_blank" rel="noopener">${esc(r)}</a>`).join(" · ")}</div>`:"")+resList(o,pickable,kind);
}

let pdfP=null;
function loadPdfJs(){
  if(!pdfP)pdfP=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";res(window.pdfjsLib)};s.onerror=()=>{pdfP=null;rej()};document.head.appendChild(s)});
  return pdfP;
}
async function loadMaterial(file){
  if(!file)return;
  const close=busy("Reading the file…");
  try{
    let text="";
    if(/pdf$/i.test(file.type)||/\.pdf$/i.test(file.name)){
      const lib=await loadPdfJs();const doc=await lib.getDocument({data:await file.arrayBuffer()}).promise;
      for(let p=1;p<=Math.min(doc.numPages,12);p++){const c=await (await doc.getPage(p)).getTextContent();text+=c.items.map(i=>i.str).join(" ")+"\n"}
    }else text=await file.text();
    FS.meetingText=text.replace(/[ \t]+/g," ").trim().slice(0,12000);close();renderMinistry();toast("File loaded. Check the text, then make the plan.");
  }catch(e){close();toast("Couldn't read this file. Copy the text from JW Library and paste it instead.")}
}

  ${o.ghana?`<div class="block"><b>Ghana picture</b>${esc(o.ghana)}</div>`:""}
